<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>그림자 수리검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#14111b;
  --pan:#2a201c; --pan-2:#3a2d26; --pan-3:#1f1714; --edge:#5a4638;
  --card:#efe3cc; --card-edge:#8a6b4d; --ink:#3a2a1e; --ink-2:#6a5040;
  --orange:#f08a24; --orange-hi:#ffae45; --orange-d:#c86a12;
  --green:#5aa83a; --green-hi:#8ad062; --green-d:#3f8a2a;
  --red:#d23a2f; --gold:#f2c14e; --text:#f3ecdf; --muted:#b9a58c;
  --navH:64px;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe29a,#d9a23c 60%,#9a6a1c);position:relative;flex:none;box-shadow:0 0 0 1px #6b4712}
.coin::after{content:"";position:absolute;inset:6px;background:#6b4712;border-radius:1px}
.gem{display:inline-block;width:18px;height:16px;flex:none;background:linear-gradient(160deg,#ff9aa8,#e0243c 55%,#8a0f22);clip-path:polygon(22% 0,78% 0,100% 35%,50% 100%,0 35%)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--muted)}
.ui{position:absolute;inset:0;pointer-events:none}
.ui .pe{pointer-events:auto}

/* ---------- 상단 프로필 / 재화 ---------- */
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px 26px;background:linear-gradient(180deg,rgba(14,11,20,.85),rgba(14,11,20,0))}
.prof{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #c89a5a;background:radial-gradient(#4a372c,#2a201c);flex:none}
.avatar canvas{width:100%;height:100%;border-radius:50%;display:block}
.lvb{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#2a201c;border:2px solid #c89a5a;color:#fff;font-family:var(--display);font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.nick{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
.rtag{font-family:var(--body);font-size:11px;font-weight:700;color:#241a08;background:var(--gold);border-radius:999px;padding:2px 8px;text-shadow:none;line-height:1.3;letter-spacing:.02em}
.cp{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:14px;color:#ffe6b0;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.cp svg{color:#d9d4cc;font-size:15px}
.xp{width:112px;height:7px;border-radius:999px;background:#1a1210;border:1px solid #4a3a30;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5aa83a,#9ae070);transition:width .25s}
.cur{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:112px;background:rgba(20,15,12,.85);border:2px solid #4a3a30;border-radius:999px;padding:2px 12px 2px 4px;font-family:var(--display);font-size:14px;color:#fff}
.pill.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.1)}}

/* ---------- 스테이지 ---------- */
.stagebox{position:absolute;top:86px;left:50%;transform:translateX(-50%);width:min(300px,74%);display:flex;flex-direction:column;align-items:center;gap:6px}
.stname{display:flex;align-items:center;gap:8px;background:rgba(20,15,12,.88);border:2px solid #4a3a30;border-radius:999px;padding:3px 6px 3px 12px;font-family:var(--display);font-size:15px;color:#fff;white-space:nowrap}
.stname svg{color:#ffb04a}
.autob{display:flex;align-items:center;gap:4px;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);padding:2px 6px;border-radius:999px;background:#2a201c}
.autob i{width:12px;height:12px;border-radius:3px;border:2px solid #7a6050;display:inline-block}
.autob[aria-pressed="true"]{color:#fff}
.autob[aria-pressed="true"] i{background:var(--orange);border-color:var(--orange-hi)}
.stbar{position:relative;width:100%;height:18px;border-radius:999px;background:#2a1a14;border:2px solid #c89a5a;overflow:hidden}
.stbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#ff9a4a,#d9531a);transition:width .25s}
.stbar.boss i{background:linear-gradient(180deg,#ffd77a,#e6a030)}
.stbar.low i{background:linear-gradient(180deg,#ff6a5a,#b3261e)}
.stbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:12px;line-height:14px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.8)}
.bossbtn{margin-top:2px;font-family:var(--display);font-size:15px;color:#ffe6b0;background:linear-gradient(180deg,#c42d24,#7a1712);border:2px solid #e6b450;padding:7px 26px;clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);text-shadow:0 1px 0 #000;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.25)}}

/* ---------- 오른쪽 버튼 / 획득 알림 ---------- */
.sbtn{width:48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:11px;color:#fff;text-shadow:0 1px 1px #000}
.sbtn b{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#4a372c,#2a201c);border:2px solid #7a5838;font-size:22px;color:#f2c14e}
.feed{position:absolute;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.feed div{background:linear-gradient(90deg,rgba(20,15,12,0),rgba(20,15,12,.85) 25%);padding:4px 12px 4px 36px;font-size:12px;font-weight:700;color:#f2e3c6;transition:opacity .5s}
.feed div b{color:var(--gold);font-weight:700}

/* ---------- 하단 메뉴 ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:var(--navH);display:grid;grid-template-columns:repeat(5,1fr);background:linear-gradient(180deg,#3a2d26,#1f1714);border-top:2px solid var(--edge)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:13px;color:#cdb89c;border-right:1px solid rgba(0,0,0,.35);position:relative}
.nav button svg{font-size:26px;color:#d9b98a}
.nav button.on{background:linear-gradient(180deg,#6a5040,#3a2d26);color:#fff}
.nav button.on svg{color:#ffb04a}
.nav .mid.close b{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(180deg,#e0524a,#9a1f18);border:3px solid #ffd0c0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.nav .mid.close b svg{color:#fff}
.dot{position:absolute;top:6px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--body);font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #2a201c}

/* ---------- 패널 공통 ---------- */
.panel{position:absolute;left:0;right:0;bottom:var(--navH);height:min(58%,560px);background:var(--pan);border-top:3px solid var(--edge);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
/* 장비 창은 화면 전체로 */
.panel.full{top:0;height:auto;border-top:0}
.panel.full .ptabs{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.ghead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--pan-3);border-bottom:2px solid var(--edge);font-family:var(--display);font-size:14px}
.ghead .pill{min-width:0;font-size:13px}
@media (min-width:760px){.panel.full{top:0}}
@media (min-width:760px){.panel{left:50%;right:auto;transform:translateX(-50%);width:560px;border:3px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0}}
.ptabs{display:flex;gap:6px;padding:8px 10px 0;background:var(--pan-3);border-bottom:3px solid var(--edge);flex:none}
.ptabs button{flex:1;max-width:150px;padding:9px 4px 8px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#5a4638,#43342b);color:#e8d9c0;font-family:var(--display);font-size:15px;position:relative}
.ptabs button.on{background:linear-gradient(180deg,var(--orange-hi),var(--orange));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.pscroll{flex:1;min-height:0;overflow-y:auto;padding:10px}
.seg{display:grid;gap:6px;padding:10px 10px 0;flex:none}
.seg button{padding:7px 0;border-radius:8px;background:#3a2d26;border:2px solid var(--edge);color:#e8d9c0;font-family:var(--display);font-size:14px}
.seg button.on{background:linear-gradient(180deg,#8a6b4d,#6a5040);color:#fff;border-color:#b08a60}
.pfoot{flex:none;display:flex;justify-content:space-between;gap:12px;padding:8px 16px 10px;border-top:2px solid var(--edge);background:var(--pan-3)}
.pfoot .obtn{flex:0 1 150px;font-size:15px;padding:8px 10px}

/* 버튼 */
.obtn{background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:2px solid var(--orange-d);border-radius:8px;color:#fff;font-family:var(--display);font-size:14px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #8a4a0c;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.obtn:active{transform:translateY(2px);box-shadow:none}
.obtn .cost{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap}
.obtn .cost .coin{width:13px;height:13px}.obtn .cost .coin::after{inset:4px}
.obtn .cost .gem{width:13px;height:12px}
.obtn.green{background:linear-gradient(180deg,var(--green-hi),var(--green));border-color:var(--green-d);box-shadow:0 2px 0 #2a5a1a}
.obtn.brown{background:linear-gradient(180deg,#c89a6a,#a67a4e);border-color:#7a5838;box-shadow:0 2px 0 #5a3e24}
.obtn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.big{font-size:17px;padding:10px}

/* 아이콘 타일 */
.itile{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;border:2px solid #3a2a1e;color:#fff;font-size:28px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.t-sword{background:linear-gradient(160deg,#ff8a4a,#c2361c)}
.t-heart{background:linear-gradient(160deg,#7ee07a,#2e8a3a)}
.t-regen{background:linear-gradient(160deg,#5ee0b0,#1f8a6a)}
.t-crit{background:linear-gradient(160deg,#ff6a7a,#a8203a)}
.t-burst{background:linear-gradient(160deg,#ffc04a,#d06a10)}
.t-bolt{background:linear-gradient(160deg,#ffe07a,#c8901a)}
.t-exp{background:linear-gradient(160deg,#7ad0ff,#2a6ab8)}
.t-coin{background:linear-gradient(160deg,#ffe29a,#b8841c)}
.t-relic{background:linear-gradient(160deg,#c07bff,#5a2a9a)}

/* 강화 행 */
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--card-edge);border-radius:10px;padding:8px;color:var(--ink);margin-bottom:8px}
.uinfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.uinfo b{font-family:var(--display);font-weight:400;font-size:16px}
.ulv{font-family:var(--display);font-size:12px;color:var(--ink-2)}
.uval{font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uval em{font-style:normal;color:#e06d10}
.uval .ar{color:#e06d10;margin:0 3px}
.uright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.umax{font-family:var(--display);font-size:10px;color:var(--ink-2);white-space:nowrap}
.urow .obtn{min-width:104px}
.spcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:linear-gradient(180deg,#5a4638,#43342b);border:2px solid #7a5838;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.spcard small{font-size:11px;color:var(--muted)}
.spcard b{font-family:var(--display);font-weight:400;font-size:19px}
.spcard b em{font-style:normal;color:var(--gold)}

/* 장비 */
.gdet{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:10px;background:var(--pan-3);border-bottom:2px solid var(--edge)}
.gbox{position:relative;width:78px;height:78px;border-radius:10px;border:3px solid var(--rc);background:radial-gradient(circle at 50% 40%,#4a3a30,#1a1210);flex:none;display:block}
.gbox .ic{position:absolute;inset:7px}
.gbox .gg{position:absolute;top:0;right:5px;font-family:var(--display);font-size:15px;color:var(--gc);text-shadow:0 1px 0 #000,0 0 4px #000}
.gbox .gl{position:absolute;top:1px;left:5px;font-family:var(--display);font-size:13px;color:var(--rc);text-shadow:0 1px 0 #000}
.gbox .lv{position:absolute;right:4px;bottom:1px;font-family:var(--display);font-size:12px;color:#fff;text-shadow:0 1px 1px #000}
.gbox .eq{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:5px;background:var(--gold);color:#241a08;font-family:var(--display);font-size:12px;display:grid;place-items:center;border:2px solid #7a5838}
.gbox.lock .ic{filter:grayscale(.55) brightness(.75);opacity:.8}
.gbox.lock{border-style:dashed}
.gbox .no{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:4px;padding:0 4px;white-space:nowrap}
.cbar{position:relative;height:12px;margin-top:5px;border-radius:999px;background:#1a1210;border:1px solid #4a3a30;overflow:hidden}
.cbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#8ad062,#4a9a2a)}
.cbar.full i{background:linear-gradient(180deg,#ffd77a,#e6a030)}
.cbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:9px;line-height:11px;color:#fff;text-shadow:0 1px 1px #000}
.ginfo{min-width:0;display:flex;flex-direction:column;gap:4px}
.ginfo h4{margin:0;display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:400;font-size:17px}
.ginfo h4 span{font-size:13px;color:var(--muted)}
.ginfo h4 span b{color:var(--gold);font-weight:400}
.fxs{background:#3a2d26;border-radius:6px;padding:3px 8px}
.fxs h5{margin:0;font-size:11px;color:var(--gold)}
.fxr{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.fxr em{font-style:normal;color:#ffb04a}
.gbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slottabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 10px 2px}
.slottabs button{padding:6px 0;border-radius:6px;background:#3a2d26;border:2px solid var(--edge);font-family:var(--display);font-size:14px;color:#cdb89c;min-width:0;white-space:nowrap}
.slottabs button.on{background:linear-gradient(180deg,#9a7858,#6a5040);border-color:#c8a070;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.ggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
.lb-stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#3a2230,#2a1a16 60%,#1f1714);border:2px solid #8a6b4d}
.lb-stage canvas{display:block;width:100%;max-width:360px;aspect-ratio:6/5;margin:0 auto;cursor:pointer}
.lb-name{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:17px;color:#fff;text-shadow:0 2px 0 #000}
.lb-cp{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:5px;font-size:12px;color:#e8d9c0}
.lb-cp b{font-family:var(--display);font-weight:400;font-size:15px;color:#ffe6b0}
.lb-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:stretch}
.lb-snd{font-size:13px;padding:6px 12px}
.lb-who{display:flex;align-items:center;gap:6px;background:#3a2d26;border:2px solid var(--edge);border-radius:8px;padding:6px 12px;font-family:var(--display);font-size:15px}
.lb-who small{font-family:var(--body);font-size:11px;color:var(--muted)}
.pick{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 16px;background:radial-gradient(circle at 50% 40%,#3a2230,#14111b 70%);box-sizing:border-box}
.pick h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:#ffe6b0;text-shadow:0 3px 0 #000}
.pick p{margin:0;font-size:13px;color:var(--muted);text-align:center}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
.pcard2{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,#3a2d26,#241a16);border:3px solid var(--edge);border-radius:16px;padding:10px 6px 12px}
.pcard2 canvas{width:100%;max-width:170px;aspect-ratio:4/5;display:block}
.pcard2 b{font-family:var(--display);font-weight:400;font-size:20px;color:#fff}
.pcard2[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(242,193,78,.45)}
.pick .obtn{width:100%;max-width:420px}
.lb-kv{display:grid;grid-template-columns:1fr auto 1fr auto;gap:4px 10px;font-size:12px}
.lb-kv b{text-align:right;font-family:var(--display);font-weight:400;font-size:13px}
.stab{margin-top:12px;background:#3a2d26;border:2px solid var(--edge);border-radius:10px;padding:8px 10px}
.stab h5{margin:0 0 6px;display:flex;justify-content:space-between;font-size:13px;color:var(--gold)}
.stab h5 span{color:var(--muted);font-weight:400}
.stgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px 8px;font-size:11px;align-items:center}
.stgrid .h{color:var(--muted);font-size:10px}
.stgrid b{font-family:var(--display);font-weight:400;font-size:14px;text-align:center}
.stgrid span{color:#9a8a78}
.stgrid span.on,.uni.on{color:#fff;font-weight:700}
.stgrid span.on::before{content:"● ";color:var(--green-hi)}
.uni{margin-top:6px;font-size:11px;color:#9a8a78}
.uni b{color:var(--gold);font-weight:700}
.uni small{color:var(--muted)}
.gcard{display:flex;flex-direction:column;min-width:0}
.gcard .gbox,.rgrid .gbox{width:100%;height:auto;aspect-ratio:1}
.gcard.sel .gbox{box-shadow:0 0 0 2px #fff,0 0 14px #ffd77a}
.gname{text-align:center;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 유물 */
.rrow{background:var(--card);border:2px solid var(--card-edge);border-radius:10px;overflow:hidden;margin-bottom:8px;color:var(--ink)}
.rhead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#7a5c46,#5a4436);color:#fff;font-family:var(--display);font-size:14px;padding:5px 10px}
.rhead span{font-size:12px;color:#e8d4b4}
.rbody{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px}
.rbody .v{font-family:var(--display);font-size:16px}
.rbody .v em{font-style:normal;color:#e06d10}
.rbody small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}

/* 소환 */
.banner{position:relative;border-radius:14px;border:3px solid #8a6b4d;padding:10px 10px 10px 100px;margin-bottom:10px;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
.banner .art{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:84px;height:84px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.banner .art .ic{display:block;width:100%;height:100%}
.banner h4{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.slv{font-family:var(--display);font-size:12px;color:#ffd77a;display:flex;justify-content:space-between;gap:8px}
.slv span+span{font-family:var(--body);font-weight:700;color:#e8d9c0}
.sbar{position:relative;height:12px;margin:4px 0 8px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);overflow:hidden}
.sbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#8ad062,#4a9a2a)}
.sbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:9px;line-height:11px;color:#fff;text-shadow:0 1px 1px #000}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtns .obtn{font-size:13px;padding:4px 2px}

/* 승급 */
.rk{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;background:linear-gradient(180deg,#5a2a22,#2a1a16);border:2px solid #8a6b4d;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.rk canvas{width:110px;height:130px;display:block}
.rk h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:24px;color:#ffe6b0}
.rk small{font-size:11px;color:var(--muted)}
.rkfx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rkfx span{font-size:11px;font-weight:700;background:rgba(0,0,0,.35);border:1px solid #7a5838;border-radius:999px;padding:1px 8px;color:#ffd77a}
.rkhead{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#8a2a1e,#5a1a12);border:2px solid #c89a5a;border-radius:8px;padding:7px;font-family:var(--display);font-size:15px;color:#ffe6b0;margin-bottom:8px}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--card-edge);border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--ink)}
.prog b{font-family:var(--display);font-weight:400;font-size:14px}
.mis{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#3a2d26;border:2px solid var(--edge);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.mis b{font-size:13px}
.mbar{position:relative;height:13px;margin-top:4px;border-radius:999px;background:#1a1210;border:1px solid #4a3a30;overflow:hidden}
.mbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#ffd77a,#c8901a)}
.mbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:10px;line-height:12px;color:#fff;text-shadow:0 1px 1px #000}
.mst{font-family:var(--display);font-size:12px;padding:7px 10px;border-radius:8px;background:#4a3d35;color:#b9a58c;white-space:nowrap}
.mst.ok{background:linear-gradient(180deg,var(--green-hi),var(--green));color:#fff}

/* 모달 */
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,10,.65);padding:0 16px;z-index:5}
.sheet{width:100%;max-width:400px;max-height:calc(100% - 32px);overflow-y:auto;background:var(--pan);border:3px solid #8a6b4d;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet h2{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:24px;color:#ffe6b0}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rgrid .new{position:absolute;top:-5px;left:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:0 4px;z-index:1}
.info h5{margin:0 0 6px;font-size:13px;color:var(--gold)}
.info .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.info .kv b{text-align:right;font-family:var(--display);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:3px 10px;border-radius:999px;background:#3a2d26;border-left:4px solid var(--rc,var(--gold))}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.toast{position:absolute;left:50%;top:190px;transform:translateX(-50%);background:rgba(20,15,12,.92);border:2px solid #c89a5a;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;pointer-events:none;transition:opacity .3s;z-index:9;white-space:nowrap}
.ic{background-repeat:no-repeat;background-image:var(--atlas);background-size:800% 1000%}


/* ---- 장비 창 압축 (폰에서 보유 장비 목록을 넓게) ---- */
.panel.full .ptabs{padding:6px 10px 0}

.panel.full .ghead{padding:5px 12px;font-size:13px}

.ginfo h4{font-size:15px}

.fxs{padding:2px 7px}

.fxr{font-size:11px;line-height:1.35}
.gbtns .obtn{gap:1px;padding:4px 4px;font-size:13px;white-space:nowrap;min-width:0}

.slottabs{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:6px 8px 2px}

.ggrid{gap:6px 8px}
.gcard .gname{display:none}

.pscroll{padding:8px 10px}

<script>
(()=>{
'use strict';
/* ================= 스프라이트 데이터 ================= */
const META={"f":{"idle":{"w":142,"h":211,"n":8,"ax":71,"ay":205},"walk":{"w":136,"h":215,"n":8,"ax":68,"ay":209},"throw":{"w":156,"h":212,"n":7,"ax":78,"ay":206},"rear":{"w":142,"h":211,"n":8,"ax":71,"ay":205}},"m":{"idle":{"w":160,"h":212,"n":8,"ax":80,"ay":206},"walk":{"w":156,"h":220,"n":8,"ax":78,"ay":214},"throw":{"w":186,"h":212,"n":8,"ax":93,"ay":206},"rear":{"w":154,"h":216,"n":8,"ax":77,"ay":210}}};

const MOTION={"p":{"f":{"0":{"w":179,"h":210,"n":8,"ax":83.9,"ay":207.8},"1":{"w":183,"h":211,"n":8,"ax":91.7,"ay":209.3},"2":{"w":165,"h":205,"n":8,"ax":86.1,"ay":201.5},"3":{"w":171,"h":204,"n":8,"ax":80.0,"ay":201.5},"4":{"w":190,"h":207,"n":8,"ax":109.5,"ay":205.1},"5":{"w":182,"h":204,"n":8,"ax":102.3,"ay":201.5},"6":{"w":199,"h":204,"n":8,"ax":84.4,"ay":202.4},"7":{"w":186,"h":206,"n":8,"ax":109.9,"ay":203.6},"8":{"w":194,"h":209,"n":8,"ax":100.1,"ay":206.6},"9":{"w":165,"h":205,"n":8,"ax":81.6,"ay":202.4}},"m":{"0":{"w":203,"h":227,"n":8,"ax":85.7,"ay":222.0},"1":{"w":185,"h":205,"n":8,"ax":84.7,"ay":202.2},"2":{"w":186,"h":207,"n":8,"ax":91.2,"ay":204.4},"3":{"w":189,"h":205,"n":8,"ax":102.8,"ay":201.6},"4":{"w":191,"h":209,"n":8,"ax":96.4,"ay":203.2},"5":{"w":183,"h":218,"n":8,"ax":78.5,"ay":213.9},"6":{"w":184,"h":204,"n":8,"ax":95.3,"ay":201.5},"7":{"w":226,"h":211,"n":8,"ax":133.9,"ay":206.0},"8":{"w":184,"h":213,"n":8,"ax":91.1,"ay":211.3},"9":{"w":202,"h":207,"n":8,"ax":97.5,"ay":205.2}}},"k":{"0":{"w":153,"h":77,"n":8,"ax":1.2,"ay":38.3},"1":{"w":153,"h":79,"n":8,"ax":1.2,"ay":39.3},"2":{"w":153,"h":86,"n":8,"ax":1.2,"ay":42.8},"3":{"w":153,"h":82,"n":8,"ax":1.1,"ay":41.0},"4":{"w":153,"h":90,"n":8,"ax":1.2,"ay":45.0},"5":{"w":153,"h":84,"n":8,"ax":1.2,"ay":41.7},"6":{"w":153,"h":92,"n":8,"ax":1.1,"ay":45.7},"7":{"w":153,"h":85,"n":8,"ax":1.1,"ay":42.1},"8":{"w":153,"h":80,"n":8,"ax":1.2,"ay":39.7},"9":{"w":153,"h":102,"n":8,"ax":1.1,"ay":50.7}}};
const motion={p:{f:{},m:{}},k:{}};
const hasP=(g,set)=>!!motion.p[g][set], hasK=set=>!!motion.k[set];
// 뒷모습 캐릭터: 상의 세트의 실제 옷 그림 (없으면 기존 색 바꾸기 그림)
function drawRealBack(c,g,set,frame,x,y,hgt,alpha=1){
  const m=MOTION.p[g][set], img=motion.p[g][set], sc=hgt/200, f=((frame%m.n)+m.n)%m.n;
  c.save(); c.globalAlpha=alpha; c.drawImage(img,f*m.w,0,m.w,m.h,x-m.ax*sc,y-m.ay*sc,m.w*sc,m.h*sc); c.restore();
}
// 날아가는 쿠나이: 오른쪽을 향한 그림을 진행 방향으로 돌리고, 리본이 펄럭이게 프레임을 넘긴다
function drawRealKunai(c,set,x,y,len,ang,t){
  const m=MOTION.k[set], img=motion.k[set], f=Math.floor(t*14)%m.n, sc=len/m.w;
  c.save(); c.translate(x,y); c.rotate(ang); c.drawImage(img,f*m.w,0,m.w,m.h,-m.w*sc*.75,-m.ay*sc,m.w*sc,m.h*sc); c.restore();
}
const aurl=n=>(window.ASSET_MAP&&window.ASSET_MAP[n])||'assets/'+n;

/* ================= 장비 기본 데이터 ================= */
const SLOTS=[{n:'두건'},{n:'목도리'},{n:'상의'},{n:'장갑'},{n:{f:'치마',m:'바지'}},{n:'신발'},{n:'허리띠'},{n:'쿠나이'}];
const RC=['#b8b0a2','#b8b0a2','#8fc46a','#8fc46a','#5b9bff','#5b9bff','#5b9bff','#c07bff','#c07bff','#ffc94a'];

const SETS=[
  {n:'입문자',cloth:null,acc:null,glow:'#e9e2d4'},
  {n:'강화',cloth:[36,28,32],acc:[176,20,30],glow:'#ff5a4a'},

  {n:'그림자',cloth:[44,30,66],acc:[146,74,255],glow:'#b27bff'},
  {n:'화염',cloth:[58,16,14],acc:[255,86,24],glow:'#ff8a3a'},

// 장비 = 세트(01~10) × 등급(F·D·A·S). t 는 0~39 번호: 세트 = t>>2, 등급 = t&3
const GR=['F','D','A','S'], GRC=['#c8c0b0','#7fd06a','#c07bff','#ffc94a'], GRMUL=[1,1.5,2.2,3];
const TIERS=40;
const MERGE=2; // 같은 장비 2개 → 한 등급 위
const setOf=t=>t>>2, grOf=t=>t&3;
const setNo=t=>String(setOf(t)+1).padStart(2,'0');
const pEq=(eq=save.eq)=>eq.map(setOf); // 캐릭터 옷 색·쿠나이 모양은 세트 기준

/* ================= 숫자 표기 (만 · 억 · 조 · 경) ================= */
function fmtKo(n){
  n=Math.floor(n); if(!isFinite(n)) return '∞'; if(n<10000) return n.toLocaleString();
  const U=[[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
  for(let i=0;i<U.length;i++){const [v,u]=U[i]; if(n>=v){const a=Math.floor(n/v); let s=a.toLocaleString()+u;
    if(i<U.length-1){const [v2,u2]=U[i+1]; const b=Math.floor((n-a*v)/v2); if(b) s+=b+u2;} return s;}}
}
const fmtPct=v=>{const p=v*100; return (p>=10000?fmtKo(p):(+p.toFixed(p<10?2:p<100?1:0)).toLocaleString())+'%';};

/* ================= 저장 ================= */
const SKEY='shadow-shuriken-v3';
const save={picked:false,gold:0,gems:3000,g:'f',mute:false,lv:1,xp:0,stage:1,kills:0,bestStage:0,autoBoss:true,
  up:{},sp:{},inv:{},eq:[0,0,0,0,0,0,0,0],relic:{},sum:{},free:{day:''},rank:0,pulls:0};
try{

  if(!s){ // 이전 버전 기록: 세트 번호를 F등급으로 옮긴다

    if(o){const inv={};for(const k in o.inv||{}){const [sl,t]=k.split('-').map(Number);inv[sl+'-'+t*4]=o.inv[k];} o.inv=inv; o.eq=(o.eq||[]).map(t=>t*4); s=o;}
  }
  if(s&&typeof s==='object'){Object.assign(save,s); if(s.picked===undefined&&((s.lv||1)>1||(s.stage||1)>1)) save.picked=true;} // 이미 진행한 기록은 선택한 것으로

for(let s=0;s<8;s++) if(!save.inv[s+'-0']) save.inv[s+'-0']={n:0,lv:1}; // 입문자 장비는 처음부터 보유

const scaleFx=(fx,m)=>{const o={};for(const k in fx) o[k]=fx[k]*m;return o;};

function calc(eq=save.eq){
  const s={atkF:10,atkP:0,hpF:100,hpP:0,regF:1,regP:0,aspd:0,crit:.05,cdmg:1.5,gold:0,xp:0,shield:0,multi:1,extra:0,pierce:0,poison:0,shadow:0,blast:0};
  const add=o=>{for(const k in o){if(k==='multi') s.multi=Math.max(s.multi,o[k]); else s[k]=(s[k]||0)+o[k];}};
  // 골드 강화
  s.atkF=UPG[0].val(upLv('atk')); s.hpF=UPG[1].val(upLv('hp')); s.regF=UPG[2].val(upLv('regen'));
  s.crit=UPG[3].val(upLv('crit')); s.cdmg=UPG[4].val(upLv('cdmg')); s.aspd=UPG[5].val(upLv('aspd'));
  s.gold+=UPG[6].val(upLv('gold')); s.xp+=UPG[7].val(upLv('xp'));
  // 레벨 스텟
  for(const p of SP) s[p.fx]+=(save.sp[p.k]||0)*p.per;
  // 장착 효과
  eq.forEach((t,sl)=>{const it=inv(sl,t); add(equipFx(sl,t,it&&it.lv?it.lv:1));});
  // 보유 효과
  for(const key in save.inv){const it=save.inv[key]; if(!it.lv) continue; const [sl,t]=key.split('-').map(Number); add(ownFx(sl,t,it.lv));}
  // 유물
  for(const r of RELICS) s[r.fx]+=rel(r.k).lv*r.per;
  // 세트 효과
  // 세트 효과: 같은 세트 2·4부위. 그 부위들 중 가장 낮은 등급(F·D·A·S)만큼 효과가 커진다
  const active=[];
  for(let k=1;k<10;k++) for(const [need,,fx] of SETFX[k]){ if(need>=8) continue;
    let best=-1; for(let g=3;g>=0;g--){ if(eq.filter(t=>setOf(t)===k&&grOf(t)>=g).length>=need){best=g;break;} }
    if(best>=0){const f=scaleFx(fx,GRMUL[best]); add(f); active.push({t:k,g:best,need,txt:fxLine(f)});} }
  const minT=Math.min(...eq.map(setOf));
  for(let k=1;k<=minT;k++){const u=SETFX[k][2]; add(u[2]); active.push({t:k,need:8,txt:u[1]});}
  // 승급
  for(let i=1;i<=save.rank;i++) add(RANKS[i].fx);
  s.crit=Math.min(1,s.crit);
  s.atk=Math.max(1,Math.round(s.atkF*(1+s.atkP)));
  s.hp=Math.max(1,Math.round(s.hpF*(1+s.hpP)));
  s.regen=s.regF*(1+s.regP);
  s.aps=Math.min(10,BASE_APS*(1+s.aspd));
  s.shots=s.multi+s.extra;
  s.cp=Math.round(s.atk*s.aps*(1+s.crit*(s.cdmg-1))*s.shots*4+s.hp*.5);
  s.minT=minT; s.active=active;
  return s;
}

function analyze(g,a,img){
  const m=META[g][a], w=img.width, h=img.height;
  const c=mkCanvas(w,h), x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0);
  const px=x.getImageData(0,0,w,h).data;
  const N=w*h, zone=new Int8Array(N).fill(-1), kind=new Uint8Array(N), wt=new Float32Array(N), lum=new Float32Array(N);
  for(let y=0;y<h;y++){
    const zy=(m.ay-y)/SPRITE_H;
    for(let X=0;X<w;X++){
      const i=y*w+X, p=i*4; if(px[p+3]<8) continue;
      const r=px[p],gg=px[p+1],b=px[p+2], mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), sat=mx?(mx-mn)/mx:0;
      let k=0,v=0;
      if(r>70&&r>gg*1.6&&r>b*1.45&&sat>.42){k=2;v=Math.min(1,(sat-.42)/.18);}
      else if(mx<128&&mx>16&&sat<.3){k=1;v=Math.min(1,(mx-16)/24)*Math.min(1,(.3-sat)/.1);}
      if(!k) continue;
      const side=Math.abs((X%m.w)-m.ax)/SPRITE_H;
      let z;
      if(zy>.24&&zy<.56&&side>.2) z=3;
      else if(k===1) z=zy>.64?0:zy>.31?2:4;
      else z=zy>.61?0:zy>.5?1:zy>.28?6:5;
      zone[i]=z; kind[i]=k; wt[i]=v; lum[i]=.3*r+.59*gg+.11*b;
    }
  }

  let sx=0,cnt=0; const y0=Math.max(0,Math.round(m.ay-SPRITE_H*.07));
  for(let y=y0;y<=Math.min(h-1,m.ay);y++) for(let X=0;X<m.w;X++){const p=(y*w+X)*4; if(px[p+3]>100){sx+=X;cnt++;}}
  const fdx=cnt?sx/cnt-m.ax:0;
  return {w,h,px,zone,kind,wt,lum,src:c,fdx};
}

function sheet(g,eq,a){

let AC=null;
function ac(){if(save.mute) return null; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();}catch(e){AC=null} return AC;}
function tone(freq,dur,type='sine',vol=.15,slide=0,delay=0){
  const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,freq,vol=.2,q=1.5){
  const a=ac(); if(!a) return; const t=a.currentTime;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t); f.frequency.exponentialRampToValueAtTime(freq*2.5,t+dur); f.Q.value=q;
  const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(t);
}

let floorTile=null;
function buildFloor(){
  const T=Math.max(1,Math.round(H)), c=mkCanvas(Math.max(1,Math.round(W*DPR)),Math.max(1,Math.round(T*DPR))), x=c.getContext('2d'); x.scale(DPR,DPR);
  const gr=x.createLinearGradient(0,0,W,0); gr.addColorStop(0,'#2a1d19'); gr.addColorStop(.5,'#4a3328'); gr.addColorStop(1,'#2a1d19');
  x.fillStyle=gr; x.fillRect(0,0,W,T);
  const edge=Math.min(26,W*.05), pw=Math.max(44,(W-edge*2)/7);
  let seed=7; const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let px=edge;px<W-edge;px+=pw){
    x.fillStyle=`rgba(${r()<.5?'0,0,0':'255,220,180'},${.03+r()*.05})`; x.fillRect(px,0,pw,T);
    x.fillStyle='rgba(0,0,0,.35)'; x.fillRect(px,0,1.5,T);
    for(let k=0;k<2;k++){const y=r()*T; x.fillRect(px,y,pw,1.5);}
  }
  x.fillStyle='#1b1520'; x.fillRect(0,0,edge,T); x.fillRect(W-edge,0,edge,T);
  const lampGap=T/3;
  for(let i=0;i<3;i++){for(const lx of [edge*.5,W-edge*.5]){const ly=lampGap*(i+.5);
    const g=x.createRadialGradient(lx,ly,2,lx,ly,edge*3.2); g.addColorStop(0,'rgba(255,180,90,.35)'); g.addColorStop(1,'rgba(255,180,90,0)');
    x.fillStyle=g; x.fillRect(lx-edge*3.2,ly-edge*3.2,edge*6.4,edge*6.4);
    x.fillStyle='#2a2330'; x.fillRect(lx-edge*.42,ly-edge*.42,edge*.84,edge*.84);
    x.fillStyle='#ffc46e'; x.fillRect(lx-edge*.22,ly-edge*.22,edge*.44,edge*.44);}}
  floorTile=c;
}
function drawFloor(scroll){

const petals=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),v:rnd(.03,.07),w:rnd(0,6),s:rnd(2,4)}));

const sScale=s=>Math.pow(1.12,s-1), dScale=s=>Math.pow(1.085,s-1), gScale=s=>Math.pow(1.1,s-1), xScale=s=>Math.pow(1.07,s-1);

function damageEnemy(e,dmg,opt={}){

function update(dt){

  G.banner.t+=dt; G.rearT+=dt; if(!G.dead) G.scroll+=H*.05*dt;
  if(!G.dead&&G.hp<st.hp) G.hp=Math.min(st.hp,G.hp+st.regen*dt);

    else if(!G.enemies.length&&G.bossDelay<=0){
      if(!isBossStage(save.stage)) nextStage();
      else if(G.bossBlock) G.waveLeft=waveSize(save.stage);   // 보스 실패 후에는 같은 스테이지를 계속 돈다
      else G.bossDelay=1;                                       // 보스 자동 등장
    }
  }
  // 적 이동 · 공격
  for(const e of G.enemies){
    e.t+=dt; e.at+=dt;
    if(e.poisonT>0){e.poisonT-=dt; if(e.poisonT<=0) damageEnemy(e,G.st.atk*.5,{fixed:true,poison:true,col:'#5cf08a'});}
    if(e.state==='flinch'&&e.t>.3){e.state='live';e.t=0;}
    if(e.state==='die'||G.dead) continue;
    if(e.state==='live') e.p=Math.min(e.stopAt,e.p+e.speed*dt);
    if(e.p>=1){const r=enemyRect(e); e.state='die'; e.t=0; puff(r.x,r.cy,r.h*.5,'#6b5a7a'); G.shake=Math.max(G.shake,.2);
      hurtPlayer(({grunt:9,elite:15})[e.type]*dScale(save.stage)); continue;}
    if(targetable(e)){
      e.fireT-=dt;
      if(e.fireT<.45&&!e.warn) e.warn=1;
      if(e.fireT<=0){
        const bossy=e.type==='boss'||e.type==='mboss';
        e.warn=0; e.fireT=(bossy?1.6:3.2)*rnd(.8,1.25);
        const n=e.type==='boss'?3:e.type==='mboss'?2:1, r=enemyRect(e), dmg=(e.type==='boss'?14:e.type==='mboss'?11:7)*dScale(save.stage);
        for(let k=0;k<n;k++) G.shots.push({dmg,x0:r.x,y0:r.cy,t:-k*.18,dur:.9,spin:rnd(0,6)});
        SFX.enemy();
      }
    }
  }
  G.enemies=G.enemies.filter(e=>!(e.state==='die'&&e.t>.4));
  // 쿠나이: 목표를 따라가 맞힌다
  for(const k of G.kunais){
    k.t+=dt;
    if(k.target&&(k.target.state==='die'||!G.enemies.includes(k.target))) k.target=autoTargets(1,null).find(e=>!k.hit.has(e))||null;
    if(k.target){const r=enemyRect(k.target), a=Math.atan2(r.cy-k.y,r.x-k.x); k.vx=Math.cos(a)*k.sp; k.vy=Math.sin(a)*k.sp;}
    k.x+=k.vx*dt; k.y+=k.vy*dt;
    k.trail.push([k.x,k.y]); if(k.trail.length>6) k.trail.shift();
    for(const e of G.enemies){
      if(e.state==='die'||k.hit.has(e)) continue;
      const r=enemyRect(e);
      if(Math.abs(k.x-r.x)<r.hw&&k.y<r.y&&k.y>r.y-r.h*.95){
        k.hit.add(e); sparks(k.x,k.y,SETS[setOf(save.eq[7])].glow); SFX.hit();
        damageEnemy(e,G.st.atk,{ghost:k.ghost});
        if(!G.st.pierce){k.dead=true;break;}
        k.target=autoTargets(3,null).find(o=>!k.hit.has(o))||null;
      }
    }
    if(k.y<-60||k.y>H+60||k.x<-60||k.x>W+60||k.t>3) k.dead=true;
  }
  G.kunais=G.kunais.filter(k=>!k.dead);
  // 적 수리검: 맞은 개수만큼 피해
  for(const s of G.shots){s.t+=dt; if(!s.gone&&s.t>=s.dur){s.gone=true;hurtPlayer(s.dmg);}}
  G.shots=G.shots.filter(s=>!s.gone);
  // 이펙트
  for(const f of G.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;}
  G.fx=G.fx.filter(f=>f.t<f.life);
  for(const t of G.texts) t.t+=dt;
  G.texts=G.texts.filter(t=>t.t<.9);
  for(const c of G.coinFly){c.t+=dt; if(c.t>=c.dur&&!c.done){c.done=true;pop('goldPill');}}
  G.coinFly=G.coinFly.filter(c=>!c.done);
  // 보스 제한 시간
  if(G.boss&&!G.dead){G.timeLeft-=dt; if(G.timeLeft<=0) bossFailed('시간 초과!'); else updateBossBar();}
  if(G.dead){G.deathT+=dt; if(G.deathT>1.1) revive();}
}
function fitFont(txt,size,maxW,face){ctx.font=`${size}px ${face}`;const w=ctx.measureText(txt).width;if(w>maxW){size=Math.floor(size*maxW/w);ctx.font=`${size}px ${face}`;}}

function render(dt){

    const pr=$('goldPill').getBoundingClientRect(), ar=$('app').getBoundingClientRect(), tx=pr.left-ar.left+16, ty=pr.top-ar.top+pr.height/2;

// 세트 효과 표: 등급별 2·4세트 효과 + 고유 능력
function setTable(k){
  if(!k) return '<div class="stab"><h5>입문자 세트는 세트 효과가 없어요</h5></div>';
  const eq=save.eq, st=calc(), on=(g,need)=>st.active.some(a=>a.t===k&&a.g===g&&a.need===need), uni=st.minT>=k;
  const worn=eq.filter(t=>setOf(t)===k).length;
  return `<div class="stab"><h5>${SETS[k].n} 세트 효과 <span class="num">착용 ${worn}/8</span></h5>
    <div class="stgrid"><span class="h">등급</span><span class="h">2세트</span><span class="h">4세트</span>
    ${[0,1,2,3].map(g=>`<b style="color:${GRC[g]}">${GR[g]}</b>${SETFX[k].filter(x=>x[0]<8).map(([need,,fx])=>`<span class="${on(g,need)?'on':''}">${fxLine(scaleFx(fx,GRMUL[g]))}</span>`).join('')}`).join('')}</div>
    <div class="uni${uni?' on':''}"><b>고유</b> ${SETFX[k][2][1]} <small>· 8부위 모두 ${SETS[k].n} 세트 이상</small></div></div>`;
}
function combine(s,t){
  const it=inv(s,t); if(!it||it.n<MERGE||t>=TIERS-1) return false;
  it.n-=MERGE; const key=s+'-'+(t+1), nx=save.inv[key]||(save.inv[key]={n:0,lv:0});
  if(nx.lv>0) nx.n++; else nx.lv=1;
  return true;
}
function afterGear(){persist(); refreshStats(); updateDots(); renderGear();}
function refreshGearBtns(){

/* ---- 소환 ---- */
const BANNERS=[
  {k:'wep',n:'쿠나이 소환',slots:[7],c1:'#8a1e16',c2:'#2a0a08',art:[7,9]},
  {k:'arm',n:'방어구 소환',slots:[0,1,2,4],c1:'#16466e',c2:'#0a1a2a',art:[2,9]},
  {k:'acc',n:'장신구 소환',slots:[3,5,6],c1:'#1a6038',c2:'#0a2416',art:[6,9]},
  {k:'rel',n:'유물 소환',c1:'#4a2272',c2:'#160a24',relic:true}
];
const COST1=100, COST10=900, FREE_N=3, SUM_MAX=10;
const sumOf=k=>save.sum[k]||(save.sum[k]={lv:1,xp:0});
const sumNeed=lv=>20+lv*30;
const today=()=>new Date().toISOString().slice(0,10);
function freeCheck(){if(save.free.day!==today()){save.free={day:today()};for(const b of BANNERS) save.free[b.k]=FREE_N;}}
const freeLeft=()=>{freeCheck();return BANNERS.reduce((a,b)=>a+(save.free[b.k]||0),0);};
function gradeRange(lv){return [Math.max(0,Math.floor((lv-1)/3)),Math.min(9,lv+1)];}
function rollGrade(lv){const [lo,hi]=gradeRange(lv); let tot=0; const w=[]; for(let t=lo;t<=hi;t++){const v=Math.pow(.45,t-lo);w.push([t,v]);tot+=v;}
  let r=Math.random()*tot, set=lo; for(const [t,v] of w){if((r-=v)<=0){set=t;break;}}
  const x=Math.random(), g=x<.62?0:x<.87?1:x<.97?2:3; // 등급: F 62% · D 25% · A 10% · S 3%
  return set*4+g;}
function renderSummon(){
  freeCheck();
  tabs([['sum','소환']],'sum',()=>{});
  $('pbody').innerHTML=`<div class="pscroll">${BANNERS.map(b=>{const S=sumOf(b.k), [lo,hi]=gradeRange(S.lv), mx=S.lv>=SUM_MAX;
    const art=b.relic?`<div class="itile t-relic" style="width:84px;height:84px;font-size:46px;border-radius:18px">${svgI('burst')}</div>`:iconEl(b.art[0],b.art[1]*4);
    return `<div class="banner" style="--c1:${b.c1};--c2:${b.c2}" data-b="${b.k}"><div class="art">${art}</div>
      <h4>${b.n}</h4>
      <div class="slv"><span>소환 레벨 LV.${S.lv}</span><span>${b.relic?'유물 조각 4종':`${SETS[lo].n} ~ ${SETS[hi].n}`}</span></div>
      <div class="sbar"><i style="width:${mx?100:S.xp/sumNeed(S.lv)*100}%"></i><span class="num">${mx?'MAX':`${S.xp}/${sumNeed(S.lv)}`}</span></div>
      <div class="sbtns">
        <button class="obtn green" data-n="free" ${save.free[b.k]?'':'disabled'}>무료 10회<span class="cost">${save.free[b.k]||0}/${FREE_N}</span></button>
        <button class="obtn" data-n="1" ${save.gems<COST1?'disabled':''}>1회<span class="cost"><i class="gem"></i>${COST1}</span></button>
        <button class="obtn" data-n="10" ${save.gems<COST10?'disabled':''}>10회<span class="cost"><i class="gem"></i>${COST10}</span></button>
      </div></div>`;}).join('')}
    <p class="note">보석은 보스 처치·레벨 업·승급으로 얻어요. 소환할수록 소환 레벨이 올라 높은 등급이 잘 나와요. 무료 소환은 매일 다시 채워져요.</p></div>`;
  $('pbody').querySelectorAll('[data-b] [data-n]').forEach(btn=>btn.onclick=()=>{
    const b=BANNERS.find(x=>x.k===btn.closest('[data-b]').dataset.b), m=btn.dataset.n;
    summon(b,m==='free'?10:+m,m==='free');});
}
function summon(b,count,free){
  freeCheck();
  if(free){if(!save.free[b.k]) return; save.free[b.k]--;}
  else{const c=count===10?COST10:COST1; if(save.gems<c) return; save.gems-=c;}
  const S=sumOf(b.k), res=[];
  for(let i=0;i<count;i++){
    if(b.relic){const r=RELICS[Math.floor(Math.random()*RELICS.length)]; rel(r.k).n++; res.push({relic:r});}
    else{const s=b.slots[Math.floor(Math.random()*b.slots.length)], t=rollGrade(S.lv), key=s+'-'+t, it=save.inv[key]||(save.inv[key]={n:0,lv:0});
      const isNew=it.lv===0; if(isNew) it.lv=1; else it.n++; res.push({s,t,isNew});}
    if(S.lv<SUM_MAX){S.xp++; if(S.xp>=sumNeed(S.lv)){S.xp=0;S.lv++;}}
  }
  save.pulls+=count; persist(); SFX.buy(); refreshStats(); updateDots(); if(panel==='summon') renderSummon();
  $('sumBody').innerHTML=`<h2>${b.n} 결과</h2><div class="rgrid">${res.map(r=>r.relic?`<div><div class="itile t-${r.relic.ic}" style="width:100%;height:auto;aspect-ratio:1">${svgI(r.relic.ic)}</div><div class="gname">${r.relic.n.replace(' 증가','')}</div></div>`
    :`<div style="position:relative">${gbox(r.s,r.t,{show:true,nolv:true})}${r.isNew?'<span class="new">NEW</span>':''}<div class="gname">${SETS[setOf(r.t)].n} ${GR[grOf(r.t)]}</div></div>`).join('')}</div>
    <div class="gbtns" style="grid-template-columns:1fr 1fr"><button class="obtn brown big" id="sumOk">확인</button><button class="obtn big" id="sumAgain" ${save.gems<COST10?'disabled':''}>10회 더<span class="cost"><i class="gem"></i>${COST10}</span></button></div>`;
  $('sumM').hidden=false;
  $('sumOk').onclick=()=>{SFX.tap();$('sumM').hidden=true;};
  $('sumAgain').onclick=()=>summon(b,10,false);
}

    </div>
    <div class="stab"><h5>능력치</h5><div class="lb-kv">${rows.map(([k,v])=>`<span>${k}</span><b class="num">${v}</b>`).join('')}</div></div>
    <div class="stab"><h5>세트 효과 · 고유 능력</h5><div class="chips">${st.active.length?st.active.map(a=>`<span style="--rc:${RC[a.t]}">${SETS[a.t].n} ${a.need<8?`${GR[a.g]}급 ${a.need}세트`:'고유'} · ${a.txt}</span>`).join(''):'<span>같은 세트를 2부위 이상 입으면 켜져요</span>'}</div></div>
  </div>`;
  $('lbSnd').onclick=()=>{save.mute=!save.mute; persist(); if(!save.mute){ac();SFX.tap();} renderLobby();};
}
let lbTap=-9;
function drawLobbyChar(){
  const cv0=$('lbcv'); if(cv0&&!cv0.onclick) cv0.onclick=()=>{lbTap=T;SFX.tap();};
  const c=$('lbcv'); if(!c) return; const x=c.getContext('2d'); x.clearRect(0,0,360,300);
  const g=x.createRadialGradient(180,200,10,180,200,190); g.addColorStop(0,'rgba(255,200,120,.3)'); g.addColorStop(1,'rgba(255,200,120,0)'); x.fillStyle=g; x.fillRect(0,0,360,300);
  x.fillStyle='#5a3e2a'; x.beginPath(); x.ellipse(180,282,96,16,0,0,7); x.fill(); x.fillStyle='#c89a5a'; x.beginPath(); x.ellipse(180,278,88,13,0,0,7); x.fill();
  const st=G?G.st:calc(); if(st.minT>0) aura(x,180,276,240,SETS[st.minT].glow,T);
  const hop=T-lbTap<.45?Math.sin(Math.PI*(T-lbTap)/.45)*26:0;
  drawNinja(x,save.g,pEq(),'idle',Math.floor(T*8),180,276-hop,240);
}

/* ---- 능력치 창 ---- */
function openInfo(){
  const st=calc();
  const rows=[['공격력',fmtKo(st.atk)],['공격 속도',`초당 ${st.aps.toFixed(2)}회`],['크리티컬',fmtPct(st.crit)],['크리티컬 데미지',fmtPct(st.cdmg)],['최대 HP',fmtKo(st.hp)],['HP 회복량',`${fmtKo(st.regen)}/초`],['동시 투척',`${st.shots}개`],['골드 획득량','+'+fmtPct(st.gold)],['경험치 획득량','+'+fmtPct(st.xp)],['전투력',fmtKo(st.cp)]];
  $('infoBody').innerHTML=`<h2>능력치</h2><div><h5>전체 능력치</h5><div class="kv">${rows.map(([k,v])=>`<span>${k}</span><b class="num">${v}</b>`).join('')}</div></div>
    <div><h5>세트 효과 · 고유 능력</h5><div class="chips">${st.active.length?st.active.map(a=>`<span style="--rc:${RC[a.t]}">${SETS[a.t].n} ${a.need<8?`${GR[a.g]}급 ${a.need}세트`:'고유'} · ${a.txt}</span>`).join(''):'<span>같은 세트를 2부위 이상 입으면 켜져요</span>'}</div>
    <p class="note" style="margin-top:6px">고유 능력: 8부위 모두 ○등급 이상이면 그 등급까지의 고유 능력이 모두 켜져요.</p></div>
    <button class="obtn big" id="infoOk">닫기</button>`;
  $('infoM').hidden=false; $('infoOk').onclick=()=>{SFX.tap();$('infoM').hidden=true;};
}

/* ================= 입력 ================= */
document.querySelectorAll('#nav [data-p]').forEach(b=>b.onclick=()=>{ac();SFX.tap();openPanel(b.dataset.p);});
$('navMid').onclick=()=>{ac();SFX.tap(); openPanel(panel||'lobby');};
$('bossBtn').onclick=()=>{ac();SFX.tap();startBoss();};
$('infoM').onclick=e=>{if(e.target.id==='infoM') $('infoM').hidden=true;};
addEventListener('resize',resize);
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('sumM').hidden) $('sumM').hidden=true; else if(!$('infoM').hidden) $('infoM').hidden=true; else if(panel) openPanel(panel);}});

/* ================= 처음 시작: 닌자 선택 (한 번만) ================= */
let pickSel=null;
function drawPick(){
  if($('pickM').hidden) return;
  document.querySelectorAll('.pcard2').forEach(b=>{const c=b.querySelector('canvas'), x=c.getContext('2d'), g=b.dataset.pick;
    x.clearRect(0,0,170,212);
    x.fillStyle='rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(85,200,48,9,0,0,7); x.fill();
    const hop=pickSel===g?Math.abs(Math.sin(T*3))*6:0;
    drawNinja(x,g,[0,0,0,0,0,0,0,0],'idle',Math.floor(T*8),85,200-hop,180);});
}
function showPick(){
  $('pickM').hidden=false;
  document.querySelectorAll('.pcard2').forEach(b=>b.onclick=()=>{pickSel=b.dataset.pick; SFX.tap();
    document.querySelectorAll('.pcard2').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('pickGo').disabled=false; $('pickGo').textContent=`${pickSel==='f'?'여닌자':'남닌자'}로 시작하기`;});
  $('pickGo').onclick=()=>{if(!pickSel) return; ac(); save.g=pickSel; save.picked=true; persist(); SFX.buy();
    $('pickM').hidden=true; startGame();};
}
function startGame(){ $('ui').hidden=false; initBattle(); layout(); drawAvatar(); updateTop(); updateDots(); openPanel('lobby'); } // 시작은 로비부터

/* ================= 루프 ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  try{ if(G&&$('pickM').hidden) update(dt); render(dt); if(panel==='grow'&&view.grow==='rank') drawRankChar(); if(panel==='lobby') drawLobbyChar(); drawPick(); }catch(err){console.error(err);}
}

/* ================= 시작 ================= */
setMid(); resize(); requestAnimationFrame(frame);
(async()=>{
  try{
    const jobs=[];
    for(const g of ['f','m']){
      for(const a of ANIMS) jobs.push(loadImg(aurl(`${g}_${a}.webp`)).then(img=>{base[g][a]=analyze(g,a,img);}));
      jobs.push(loadImg(aurl(`${g}_items.webp`)).then(img=>{atlas[g]=img;}));
      for(const k in MOTION.p[g]||{}) jobs.push(loadImg(aurl(`p${g}${String(+k+1).padStart(2,'0')}.webp`)).then(img=>{motion.p[g][k]=img;}).catch(()=>{}));
    }
    for(const k in MOTION.k) jobs.push(loadImg(aurl(`k${String(+k+1).padStart(2,'0')}.webp`)).then(img=>{motion.k[k]=img;}).catch(()=>{}));
    await Promise.all(jobs);
    $('loading').hidden=true;
    if(save.picked) startGame(); else showPick();
  }catch(err){$('loading').textContent='그림을 불러오지 못했어요. 새로고침해 주세요.';console.error(err);}
})();
})();
</script>
