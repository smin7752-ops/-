/* ---------- 상단 프로필 / 재화 ---------- */
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px 26px;background:linear-gradient(180deg,rgba(14,11,20,.85),rgba(14,11,20,0))}
.prof{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid #c89a5a;background:radial-gradient(#4a372c,#2a201c);flex:none}
.avatar canvas{width:100%;height:100%;border-radius:50%;display:block}
.lvb{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#2a201c;border:2px solid #c89a5a;color:#fff;font-family:var(--display);font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.nick{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
#nickG{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nick.long{font-size:13px}
.rtag{flex-shrink:0;font-family:var(--body);font-size:11px;font-weight:700;color:#241a08;background:var(--gold);border-radius:999px;padding:2px 8px;text-shadow:none;line-height:1.3;letter-spacing:.02em}
.cp{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:14px;color:#ffe6b0;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.cp svg{color:#d9d4cc;font-size:15px}
.xp{width:112px;height:7px;border-radius:999px;background:#1a1210;border:1px solid #4a3a30;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5aa83a,#9ae070);transition:width .25s}
.cur{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:112px;background:rgba(20,15,12,.85);border:2px solid #4a3a30;border-radius:999px;padding:2px 12px 2px 4px;font-family:var(--display);font-size:14px;color:#fff}

/* 전투력 칼 */
.cpi{display:inline-block;width:20px;height:20px;background:var(--ui-sword) center/contain no-repeat;flex:none}
/* 재화 칸 (동그라미 안에 아이콘) */
.cur .pill b{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:right;padding-left:34px}
.cur .pill{width:112px;height:31px;font-size:13px;padding:0 14px 0 0;min-width:0;background:var(--ui-cur) center/100% 100% no-repeat;border:0;border-radius:0;padding:0 18px 0 0;position:relative;justify-content:flex-end;text-shadow:0 1px 2px #000;padding-right:14px}
.cur .pill .coin,.cur .pill .gem{position:absolute;left:16.4%;top:50%;transform:translate(-50%,-50%);width:19px;height:19px}
/* ---------- 스테이지 ---------- */
.stagebox{position:absolute;top:88px;left:50%;transform:translateX(-50%);width:min(270px,70%);display:flex;flex-direction:column;align-items:center;gap:6px}
.stname{display:flex;align-items:center;justify-content:center;gap:6px;width:176px;height:42px;box-sizing:border-box;background:var(--ui-stage) center/100% 100% no-repeat;border:0;padding:0 17%;text-shadow:0 1px 2px #000;font-family:var(--display);font-size:15px;color:#fff;white-space:nowrap}
.stname svg{display:none}
.autob{display:flex;align-items:center;gap:4px;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);padding:2px 6px;border-radius:999px;background:#2a201c}
.autob i{width:12px;height:12px;border-radius:3px;border:2px solid #7a6050;display:inline-block}
.autob[aria-pressed="true"]{color:#fff}
.autob[aria-pressed="true"] i{background:var(--orange);border-color:var(--orange-hi)}
.stbar{position:relative;width:100%;height:18px;border-radius:999px;background:#2a1a14;border:2px solid #c89a5a;overflow:hidden}
.stbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#ff9a4a,#d9531a);transition:width .25s}
.stbar.boss i{background:linear-gradient(180deg,#ffd77a,#e6a030)}
.stbar.low i{background:linear-gradient(180deg,#ff6a5a,#b3261e)}
.stbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:12px;line-height:14px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.8)}
.bossbtn{margin-top:2px;font-family:var(--display);font-size:16px;color:#fff3dc;background:var(--ui-boss) center/100% 100% no-repeat;border:0;width:168px;height:49px;padding:0 0 2px;text-shadow:0 1px 0 #000;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.25)}}

/* ---------- 오른쪽 버튼 / 획득 알림 ---------- */
.sbtn{width:48px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:11px;color:#fff;text-shadow:0 1px 1px #000}
.sbtn b{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#4a372c,#2a201c);border:2px solid #7a5838;font-size:22px;color:#f2c14e}
#dunT{position:absolute;inset:0;z-index:60;background:#050308;opacity:0;transition:opacity .35s;overflow:hidden}
#dunT.in{opacity:1}
#dunT.out{opacity:0;transition:opacity .5s}
#dunT .bg{position:absolute;inset:0;background:center top/cover no-repeat;opacity:0;transform:scale(1.1);transition:opacity .6s,transform 2s cubic-bezier(.2,.7,.2,1)}
#dunT.show .bg{opacity:1;transform:scale(1)}
#dunT .vg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
@media (min-aspect-ratio:941/1672){#dunT .bg{background-size:auto 100%}}
#dunT .tt{position:absolute;left:16px;right:16px;top:auto;bottom:calc(9% + 44px);text-align:center;opacity:0;transform:translateY(16px) scale(.96);transition:opacity .5s .2s,transform .6s .2s cubic-bezier(.2,.8,.2,1.2)}
#dunT.show .tt{opacity:1;transform:none}
#dunT .tt small{display:block;font-family:var(--body);font-size:13px;letter-spacing:.3em;color:#e9c98a;margin-bottom:6px}
#dunT .tt h3{margin:0;font-family:var(--display);font-weight:400;font-size:42px;line-height:1.1;color:#ffe6b0;text-shadow:0 3px 0 #5a2a10,0 0 18px rgba(255,160,60,.75),0 0 40px rgba(255,90,40,.45)}
#dunT .tt b{display:inline-block;margin-top:10px;padding:3px 14px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid #c89a5a;font-family:var(--display);font-weight:400;font-size:17px;color:#fff}
#dunT .tt p{margin:12px 0 0;font-size:13px;color:#e6d6bb;text-shadow:0 1px 3px #000}
#dunT .ln{height:2px;margin:12px auto 0;width:0;background:linear-gradient(90deg,transparent,#ffcf7a,transparent);transition:width .7s .35s}
#dunT.show .ln{width:80%}
#dunT .lb{position:absolute;left:50%;bottom:max(5%,18px);transform:translateX(-50%);width:min(60%,300px);text-align:center;font-size:12px;color:#d8c7a8;opacity:0;transition:opacity .4s .3s}
#dunT.show .lb{opacity:1}
#dunT .lb div{height:6px;margin-top:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(214,168,90,.5)}
#dunT .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8322a,#f0b44a);transition:width 1.2s .3s linear}
#dunT.show .lb i{width:100%}
#dunX{position:absolute;inset:0;z-index:60;background:rgba(5,3,8,0);transition:background .45s}
#dunX.dark{background:rgba(5,3,8,1)}
#dunX.out{background:rgba(5,3,8,0);transition:background .55s}
#dunX .st{position:absolute;left:16px;right:16px;top:36%;text-align:center;opacity:0;transform:scale(1.9);transition:opacity .22s,transform .4s cubic-bezier(.2,.8,.3,1.25)}
#dunX.go .st{opacity:1;transform:scale(1)}
#dunX.out .st{opacity:0;transform:scale(.92);transition:opacity .4s,transform .4s}
#dunX .st h3{margin:0;font-family:var(--display);font-weight:400;font-size:46px;line-height:1.1;color:#ffe6b0;text-shadow:0 4px 0 #5a2a10,0 0 20px rgba(255,170,60,.85),0 0 46px rgba(255,110,40,.5)}
#dunX .st.fail h3{color:#e8dcd0;text-shadow:0 4px 0 #2a1a1a,0 0 18px rgba(200,60,60,.7)}
#dunX .st p{margin:10px 0 0;font-size:14px;color:#efe0c4;text-shadow:0 1px 3px #000}
#dunX .ray{position:absolute;left:50%;top:40%;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,210,120,.18) 0 8deg,transparent 8deg 22deg);border-radius:50%;opacity:0;transform:scale(.4) rotate(0);transition:opacity .4s,transform 1.4s ease-out;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
#dunX.go.win .ray{opacity:1;transform:scale(1) rotate(40deg)}
#dunX.dark .ray,#dunX.out .ray{opacity:0}
.sheet.mp{padding:10px 10px 12px;gap:8px;max-height:calc(100% - 40px);height:min(640px,calc(100% - 40px))}
.mptabs{display:flex;gap:6px;padding:0!important;background:none!important}.mptabs button{flex:1}
.mpbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mpbody .pscroll{height:auto;overflow:visible;padding:2px}
#ui.indun .nav button,#ui.indun .nav .mid{filter:grayscale(.7) brightness(.6)}
#ui.indun .sideb{display:none}
.sideb{position:absolute;right:8px;top:198px;display:flex;flex-direction:column;gap:10px;z-index:2}
.sideb button{position:relative;width:54px;height:58px;padding:0;border-radius:14px;border:2px solid #d6a85a;background:linear-gradient(180deg,#4a3222,#2a1b12);box-shadow:0 3px 0 #1a100a,0 0 0 1px #000,inset 0 1px 0 rgba(255,230,170,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#ffe6b0;font-family:var(--display);font-size:11px;text-shadow:0 1px 0 #000;cursor:pointer}
.sideb button:active{transform:translateY(2px);box-shadow:0 1px 0 #1a100a}
.sideb svg{width:28px;height:28px}
.sideb .rbico{width:30px;height:30px;background:var(--ico-stone) center/contain no-repeat;display:block}
.stone{display:inline-block;width:18px;height:18px;background:var(--ico-stone) center/contain no-repeat;vertical-align:-4px}
.rb-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(180deg,#2c1a3e,#1c1128);border:2px solid #9a6ad6;border-radius:12px;padding:10px 12px;color:#f3ecdf}
.rb-top .big{width:64px;height:64px;background:var(--ico-stone) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(170,110,255,.7))}
#rbFx{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,rgba(40,10,60,.55) 0%,rgba(6,2,12,.94) 45%,#000 80%);opacity:0;transition:opacity .6s ease}
#rbFx.on{opacity:1}
#rbFx canvas{width:min(92vw,440px);height:auto;aspect-ratio:1;mix-blend-mode:screen;margin-top:-6%;-webkit-mask:radial-gradient(circle,#000 52%,transparent 71%);mask:radial-gradient(circle,#000 52%,transparent 71%)}
#rbFx .rbT{position:absolute;left:0;right:0;top:66%;text-align:center;font-family:var(--display);font-size:34px;color:#f1dcff;text-shadow:0 0 14px #a86cff,0 0 30px #7a3cff;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
#rbFx .rbT.on{opacity:1;transform:none}
#rbFx .rbT small{display:block;font-family:var(--body);font-size:14px;color:#e8d8ff;margin-top:6px}
.rb-top b{color:#d9b8ff;font-family:var(--display);font-weight:400;font-size:20px}
.sideb .dot{top:-6px;right:-6px}
.feed{position:absolute;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.feed div{background:linear-gradient(90deg,rgba(20,15,12,0),rgba(20,15,12,.85) 25%);padding:4px 12px 4px 36px;font-size:12px;font-weight:700;color:#f2e3c6;transition:opacity .5s}
.feed div b{color:var(--gold);font-weight:700}

/* ---------- 하단 메뉴 ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:var(--navH);display:grid;grid-template-columns:repeat(5,1fr);background:#1a1210 var(--ui-nav) center bottom/100% 100% no-repeat;border-top:0;padding:0 1.5%}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:13px;color:#e8d3b0;position:relative;padding-top:18%;text-shadow:0 1px 2px #000}
.nav button.mid{padding-top:4%}
.nav .dot{top:24%}
.nav button svg{font-size:26px;color:#d9b98a}
.nav button.on{color:#ffd77a}
.nav button.on svg{filter:drop-shadow(0 0 6px #ff9a3a)}
.nav button.on svg{color:#ffb04a}
.nav .mid.close b{width:56px;height:48px;display:block;background:var(--ui-xbtn) center/contain no-repeat}
.nav .mid.close b svg{display:none}
.dot{position:absolute;top:6px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--body);font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #2a201c}

/* ---------- 패널 공통 ---------- */
.panel{position:absolute;left:0;right:0;bottom:var(--navH);height:min(58%,560px);background:var(--pan);border-top:3px solid var(--edge);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
/* 장비 창은 화면 전체로 */
.panel.full{top:0;height:auto;border-top:0}
.panel.full .ptabs{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.ghead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--pan-3);border-bottom:2px solid var(--edge);font-family:var(--display);font-size:14px}
.ghead .pill{min-width:0;font-size:13px}
@media (min-width:760px){.panel.full{top:0}}
@media (min-width:760px){.panel{left:50%;right:auto;transform:translateX(-50%);width:560px;border:3px solid var(--edge);border-bottom:0;border-radius:14px 14px 0 0}}
.ptabs{display:flex;gap:6px;padding:8px 10px 0;background:var(--pan-3);border-bottom:3px solid var(--edge);flex:none}
.ptabs button{flex:1;max-width:150px;padding:9px 4px 8px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#5a4638,#43342b);color:#e8d9c0;font-family:var(--display);font-size:15px;position:relative}
.ptabs button.on{background:linear-gradient(180deg,var(--orange-hi),var(--orange));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.pscroll{flex:1;min-height:0;overflow-y:auto;padding:10px}
.seg{display:grid;gap:6px;padding:10px 10px 0;flex:none}
.seg button{padding:7px 0;border-radius:8px;background:#3a2d26;border:2px solid var(--edge);color:#e8d9c0;font-family:var(--display);font-size:14px}
.seg button.on{background:linear-gradient(180deg,#8a6b4d,#6a5040);color:#fff;border-color:#b08a60}
.pfoot{flex:none;display:flex;justify-content:space-between;gap:12px;padding:8px 16px 10px;border-top:2px solid var(--edge);background:var(--pan-3)}
.pfoot .obtn{flex:0 1 150px;font-size:15px;padding:8px 10px}

/* 버튼 */
.obtn{background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:2px solid var(--orange-d);border-radius:8px;color:#fff;font-family:var(--display);font-size:14px;padding:5px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #8a4a0c;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.obtn:active{transform:translateY(2px);box-shadow:none}
.obtn .cost{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap}
.obtn .cost .coin,.obtn .cost .gem{width:15px;height:15px}
.obtn.green{background:linear-gradient(180deg,var(--green-hi),var(--green));border-color:var(--green-d);box-shadow:0 2px 0 #2a5a1a}
.obtn.brown{background:linear-gradient(180deg,#c89a6a,#a67a4e);border-color:#7a5838;box-shadow:0 2px 0 #5a3e24}
.obtn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.big{font-size:17px;padding:10px}

.itile.pic{background:center/cover no-repeat;border:0;box-shadow:none;border-radius:12px}
.itile{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;border:2px solid #3a2a1e;color:#fff;font-size:28px;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.t-sword{background:linear-gradient(160deg,#ff8a4a,#c2361c)}
.t-heart{background:linear-gradient(160deg,#7ee07a,#2e8a3a)}
.t-regen{background:linear-gradient(160deg,#5ee0b0,#1f8a6a)}
.t-crit{background:linear-gradient(160deg,#ff6a7a,#a8203a)}
.t-burst{background:linear-gradient(160deg,#ffc04a,#d06a10)}
.t-bolt{background:linear-gradient(160deg,#ffe07a,#c8901a)}
.t-exp{background:linear-gradient(160deg,#7ad0ff,#2a6ab8)}
.dsel{display:flex;align-items:center;justify-content:center;gap:18px}.dsel button{width:40px;height:34px;border-radius:8px;background:#5a3e2a;color:#fff;font-size:15px}.dsel button[disabled]{opacity:.35}.dsel b{font-family:var(--display);font-weight:400;font-size:24px;color:#ffe6b0;min-width:90px;text-align:center}
.dcat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dcat button{padding:7px 0;border-radius:8px;background:#3a2a20;border:2px solid #6a4a30;color:#e8d3b0;font-family:var(--display);font-size:14px}.dcat button[aria-pressed="true"]{background:linear-gradient(180deg,var(--orange-hi),var(--orange));border-color:var(--orange-d);color:#fff}
.dsub{margin:-6px 0 0;text-align:center;font-size:13px}
.dbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.dbtns .obtn{font-size:16px;padding:10px 4px}
.dlv{display:flex;align-items:center;gap:8px;margin-top:4px}.dlv button{width:26px;height:22px;border-radius:6px;background:#5a3e2a;color:#fff;font-size:11px}.dlv button[disabled]{opacity:.35}.dlv b{font-family:var(--display);font-weight:400;font-size:14px}
.t-coin{background:linear-gradient(160deg,#ffe29a,#b8841c)}
.t-relic{background:linear-gradient(160deg,#c07bff,#5a2a9a)}

/* 강화 행 */
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--card-edge);border-radius:10px;padding:8px;color:var(--ink);margin-bottom:8px}
.uinfo{display:flex;flex-direction:column;gap:1px;min-width:0}
.uinfo b{font-family:var(--display);font-weight:400;font-size:16px}
.ulv{font-family:var(--display);font-size:12px;color:var(--ink-2)}
.uval{font-family:var(--display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uval em{font-style:normal;color:#e06d10}
.uval .ar{color:#e06d10;margin:0 3px}
.uright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.umax{font-family:var(--display);font-size:10px;color:var(--ink-2);white-space:nowrap}
.urow .obtn{min-width:104px}
.spcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:linear-gradient(180deg,#5a4638,#43342b);border:2px solid #7a5838;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.spcard small{font-size:11px;color:var(--muted)}
.spcard b{font-family:var(--display);font-weight:400;font-size:19px}
.spcard b em{font-style:normal;color:var(--gold)}

/* 장비 */
.gdet{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:10px;background:var(--pan-3);border-bottom:2px solid var(--edge)}
.gbox{position:relative;width:78px;height:78px;border-radius:10px;border:3px solid var(--rc);background:radial-gradient(circle at 50% 40%,#4a3a30,#1a1210);flex:none;display:block}
.gbox .ic{position:absolute;inset:7px}
.gbox .gg{position:absolute;top:0;right:5px;font-family:var(--display);font-size:15px;color:var(--gc);text-shadow:0 1px 0 #000,0 0 4px #000}
.gbox .gl{position:absolute;top:1px;left:5px;font-family:var(--display);font-size:13px;color:var(--rc);text-shadow:0 1px 0 #000}
.gbox .lv{position:absolute;right:4px;bottom:1px;font-family:var(--display);font-size:12px;color:#fff;text-shadow:0 1px 1px #000}
.gbox .eq{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:5px;background:var(--gold);color:#241a08;font-family:var(--display);font-size:12px;display:grid;place-items:center;border:2px solid #7a5838}
.gbox.lock .ic{filter:grayscale(.55) brightness(.75);opacity:.8}
.gbox.lock{border-style:dashed}
.gbox .no{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:4px;padding:0 4px;white-space:nowrap}
.cbar{position:relative;height:12px;margin-top:5px;border-radius:999px;background:#1a1210;border:1px solid #4a3a30;overflow:hidden}
.cbar i{position:absolute;inset:0;width:0;background:linear-gradient(180deg,#8ad062,#4a9a2a)}
.cbar.full i{background:linear-gradient(180deg,#ffd77a,#e6a030)}
.cbar span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:9px;line-height:11px;color:#fff;text-shadow:0 1px 1px #000}
.ginfo{min-width:0;display:flex;flex-direction:column;gap:4px}
.ginfo h4{margin:0;display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:400;font-size:17px}
.ginfo h4 span{font-size:13px;color:var(--muted)}
.ginfo h4 span b{color:var(--gold);font-weight:400}
.fxs{background:#3a2d26;border-radius:6px;padding:3px 8px}

function fmtKo(n){
  n=Math.floor(n); if(!isFinite(n)) return '∞'; if(n<10000) return n.toLocaleString();
  const U=[[1e16,'경'],[1e12,'조'],[1e8,'억'],[1e4,'만']];
  for(let i=0;i<U.length;i++){const [v,u]=U[i]; if(n>=v){const a=Math.floor(n/v); let s=a.toLocaleString()+u;
    if(i<U.length-1){const [v2,u2]=U[i+1]; const b=Math.floor((n-a*v)/v2); if(b) s+=b+u2;} return s;}}
}
// 재화 칸용 짧은 표기: 12.3만, 1,234만, 5.67억 (소수점 버림)
function fmtShort(n){

  for(const [v,u] of U) if(n>=v){const x=n/v, d=x<10?2:x<100?1:0, f=Math.pow(10,d);

}

const scaleFx=(fx,m)=>{const o={};for(const k in fx) o[k]=fx[k]*m;return o;};
const fxLine=fx=>Object.keys(fx).map(k=>`${FXN[k]} +${fmtPct(fx[k])}`).join(' · ');
const APS_SOFT=5, APS_MAX=12;
function calc(eq=save.eq){
  const s={atkF:10,atkP:0,hpF:100,hpP:0,regF:1,regP:0,aspd:0,crit:.05,cdmg:1.5,gold:0,xp:0,shield:0,multi:1,extra:0,pierce:0,poison:0,shadow:0,blast:0};
  // 그룹별 곱연산: 공격력·HP·회복 %는 같은 그룹끼리 더하고, 그룹끼리는 곱한다 (base 스텟·장비·세트·탑 / 유물 / 환생 / 승급 / 스킨)
  const GP=['atkP','hpP','regP','gold','xp'], grp={}; let cur='base';
  const add=o=>{for(const k in o){if(k==='multi') s.multi=Math.max(s.multi,o[k]); else if(cur!=='base'&&GP.includes(k)){(grp[cur]||(grp[cur]={}))[k]=(grp[cur][k]||0)+o[k];} else s[k]=(s[k]||0)+o[k];}};
  const gm=k=>Object.values(grp).reduce((m,g)=>m*(1+(g[k]||0)),1);
  // 골드 강화
  const uv=k=>UPG.find(u=>u.k===k).val(upLv(k));   // 목록 순서와 상관없이 이름으로 찾는다
  s.atkF=uv('atk'); s.hpF=uv('hp'); s.regF=uv('regen');
  s.crit=uv('crit'); s.cdmg=uv('cdmg'); s.aspd=uv('aspd');
  s.gold+=uv('gold'); s.xp+=uv('xp');
  // 레벨 스텟
  for(const p of SP) s[p.fx]+=(save.sp[p.k]||0)*p.per;
  // 장착 효과
  eq.forEach((t,sl)=>{const it=inv(sl,t); add(equipFx(sl,t,it&&it.lv?it.lv:1));});
  // 보유 효과
  for(const key in save.inv){const it=save.inv[key]; if(!it.lv) continue; const [sl,t]=key.split('-').map(Number); add(ownFx(sl,t,it.lv));}
  // 유물 (그룹)
  cur='relic'; for(const r of RELICS) add({[r.fx]:rel(r.k).lv*r.per}); cur='base';
  // 세트 효과
  // 세트 효과: 같은 세트 2·4부위. 그 부위들 중 가장 낮은 등급(F·D·A·S)만큼 효과가 커진다
  const active=[];
  for(let k=1;k<10;k++) for(const [need,,fx] of SETFX[k]){ if(need>=8) continue;
    let best=-1; for(let g=3;g>=0;g--){ if(eq.filter(t=>setOf(t)===k&&grOf(t)>=g).length>=need){best=g;break;} }
    if(best>=0){const f=scaleFx(fx,GRMUL[best]); add(f); active.push({t:k,g:best,need,txt:fxLine(f)});} }
  const minT=Math.min(...eq.map(setOf));
  for(let k=1;k<=minT;k++){const u=SETFX[k][2]; add(u[2]); active.push({t:k,need:8,txt:u[1]});}
  // 환생 능력치 (그룹)
  cur='reb'; for(const R of REB) add({[R.fx]:rebLv(R.k)*R.per}); cur='base';
  // 스킨 (그룹)
  cur='skin'; for(let k=0;k<SETS.length;k++) if(skinOpen(k)) add(skinFx(k,'own'));
  add(skinFx(skinSet(),'eq')); cur='base';
  // 승급 (그룹)
  cur='rank'; for(let i=1;i<=save.rank;i++) add(RANKS[i].fx); cur='base';
  const tb=(save.dun&&save.dun.best&&save.dun.best.tower)||0; for(let f=10;f<=tb;f+=10) add(towerFx(f));
  s.crit=Math.min(1,s.crit);
  s.atkMul=(1+s.atkP)*gm('atkP'); s.hpMul=(1+s.hpP)*gm('hpP');
  s.atk=Math.max(1,Math.round(s.atkF*s.atkMul));
  s.hp=Math.max(1,Math.round(s.hpF*s.hpMul));
  s.regen=s.regF*(1+s.regP)*gm('regP');
  s.gold=(1+s.gold)*gm('gold')-1; s.xp=(1+s.xp)*gm('xp')-1;
  s.apsRaw=BASE_APS*(1+s.aspd); s.aps=Math.min(APS_MAX,s.apsRaw<=APS_SOFT?s.apsRaw:APS_SOFT+(s.apsRaw-APS_SOFT)*.4);   // 공속: 초당 5회 넘으면 효율 40%, 최대 12회
  s.shots=s.multi+s.extra;
  s.cp=Math.round(s.atk*s.aps*(1+s.crit*(s.cdmg-1))*s.shots*4+s.hp*.5);
  s.minT=minT; s.active=active;
  return s;
}

function analyze(g,a,img){
  const m=META[g][a], w=img.width, h=img.height;
  const c=mkCanvas(w,h), x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0);
  const px=x.getImageData(0,0,w,h).data;
  const N=w*h, zone=new Int8Array(N).fill(-1), kind=new Uint8Array(N), wt=new Float32Array(N), lum=new Float32Array(N);
  for(let y=0;y<h;y++){
    const zy=(m.ay-y)/SPRITE_H;
    for(let X=0;X<w;X++){
      const i=y*w+X, p=i*4; if(px[p+3]<8) continue;
      const r=px[p],gg=px[p+1],b=px[p+2], mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), sat=mx?(mx-mn)/mx:0;
      let k=0,v=0;
      if(r>70&&r>gg*1.6&&r>b*1.45&&sat>.42){k=2;v=Math.min(1,(sat-.42)/.18);}
      else if(mx<128&&mx>16&&sat<.3){k=1;v=Math.min(1,(mx-16)/24)*Math.min(1,(.3-sat)/.1);}
      if(!k) continue;
      const side=Math.abs((X%m.w)-m.ax)/SPRITE_H;
      let z;
      if(zy>.24&&zy<.56&&side>.2) z=3;
      else if(k===1) z=zy>.64?0:zy>.31?2:4;
      else z=zy>.61?0:zy>.5?1:zy>.28?6:5;
      zone[i]=z; kind[i]=k; wt[i]=v; lum[i]=.3*r+.59*gg+.11*b;
    }
  }
  // 발 중앙: 첫 프레임 맨 아래 7% 줄의 불투명 픽셀 평균 x (포니테일·목도리 때문에 기준점이 한쪽으로 쏠리는 것 보정)
  let sx=0,cnt=0; const y0=Math.max(0,Math.round(m.ay-SPRITE_H*.07));
  for(let y=y0;y<=Math.min(h-1,m.ay);y++) for(let X=0;X<m.w;X++){const p=(y*w+X)*4; if(px[p+3]>100){sx+=X;cnt++;}}
  const fdx=cnt?sx/cnt-m.ax:0;
  return {w,h,px,zone,kind,wt,lum,src:c,fdx};
}
const sheetCache=new Map();
function sheet(g,eq,a){
  const key=g+a+eq.slice(0,7).join('');
  let s=sheetCache.get(key); if(s) return s;
  const A=base[g][a];
  if(eq.slice(0,7).every(v=>v===0)){sheetCache.set(key,A.src);return A.src;}
  const c=mkCanvas(A.w,A.h), x=c.getContext('2d'), out=x.createImageData(A.w,A.h), o=out.data, px=A.px;
  o.set(px);
  for(let i=0;i<A.zone.length;i++){
    const z=A.zone[i]; if(z<0) continue;
    const S=SETS[eq[z]], k=A.kind[i], col=k===1?S.cloth:S.acc; if(!col) continue;
    const p=i*4, f=A.lum[i]/(k===1?46:80), v=A.wt[i], iv=1-v;
    o[p]=px[p]*iv+Math.min(255,col[0]*f)*v;
    o[p+1]=px[p+1]*iv+Math.min(255,col[1]*f)*v;
    o[p+2]=px[p+2]*iv+Math.min(255,col[2]*f)*v;
  }
  x.putImageData(out,0,0);
  if(sheetCache.size>60) sheetCache.delete(sheetCache.keys().next().value);
  sheetCache.set(key,c); return c;
}

let AC=null, BUS=null;
function ac(){ if(save.mute) return null;
  try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); makeBus(); }
    if(AC.state==='suspended'&&!(window.OfflineAudioContext&&AC instanceof OfflineAudioContext)) AC.resume(); }catch(e){AC=null}
  return AC; }
function makeBus(){ {
      const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(AC.destination);
      const master=AC.createGain(); master.gain.value=.9; master.connect(comp);
      const sfx=AC.createGain(), bgm=AC.createGain(); sfx.connect(master); bgm.connect(master);
      // 은은한 울림(리버브): 잡음으로 만든 짧은 잔향
      const len=Math.floor(AC.sampleRate*1.2), ir=AC.createBuffer(2,len,AC.sampleRate);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
      const rev=AC.createConvolver(); rev.buffer=ir; const rg=AC.createGain(); rg.gain.value=.32; rev.connect(rg).connect(master);
      BUS={master,sfx,bgm,rev}; NZ=null; sndApply(); } }
const BGM_V=()=>save.bgmOff?0:.6*(save.bgmVol??.7), SFX_V=()=>save.sfxOff?0:1.05*(save.sfxVol??.8);

function env(g,t,a,peak,dec,sus=0.0001){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(Math.max(sus,.0001),t+a+dec); }
function osc(type,f,t,dur,peak,out,a=.005,slide=0,dec=null,wet=0){
  const A=ac(); if(!A) return; const o=A.createOscillator(), g=A.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  env(g,t,a,peak,dec==null?dur:dec); o.connect(g).connect(out); if(wet){const w=A.createGain(); w.gain.value=wet; g.connect(w).connect(BUS.rev);}
  o.start(t); o.stop(t+a+(dec==null?dur:dec)+.05); }
let NZ=null; const nzBuf=()=>{ if(NZ) return NZ; const A=AC, b=A.createBuffer(1,A.sampleRate,A.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return NZ=b; };
function nz(t,dur,type,f,q,peak,out,a=.002,f2=0,wet=0){
  const A=ac(); if(!A) return; const s=A.createBufferSource(); s.buffer=nzBuf(); const fl=A.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); fl.Q.value=q;
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); const g=A.createGain(); env(g,t,a,peak,dur);
  s.connect(fl).connect(g).connect(out); if(wet){const w=A.createGain(); w.gain.value=wet; g.connect(w).connect(BUS.rev);} s.start(t,Math.random()*.5); s.stop(t+a+dur+.05); }
const INS={
  koto:(f,t,v=.18,out)=>{ osc('triangle',f,t,1.1,v,out,.003,0,1.1,.3); osc('sine',f*2,t,.35,v*.35,out,.002,0,.35); },
  shaku:(f,t,d,v=.09,out)=>{ const A=ac(); if(!A) return; const o=A.createOscillator(), g=A.createGain(), l=A.createOscillator(), lg=A.createGain();

  boss:{bpm:132,roots:[50,50,49,51],drum:'x.x.x..xx.x.x.xx',perc:'..r...r...r.r..r',arp:[0,1,0,3,0,1,4,1],mel:[[5,2],[6,2],[7,4],null,[6,2],[5,2],[4,4],null],pad:1,low:.85},
  dun:{bpm:112,roots:[53,51,50,48],drum:'x...x.x.x...x.x.',perc:'..r...r...r...r.',arp:[0,2,3,5,3,2,0,2],mel:[[7,2],[8,2],[7,2],[5,2],[6,4],null,[4,4],null],pad:0},
  lobby:{bpm:72,roots:[50,53,48,51],drum:'x...............',perc:'........r.......',arp:[0,4,2,5,2,4,1,4],mel:[[5,6],null,[4,2],[2,4],null,[3,4],null,[1,4]],pad:1}
};
const BGM={cur:null,step:0,next:0,timer:null,bar:0};
function bgmTick(horizon=1){ const A=AC; if(!A||!BUS||save.mute||save.bgmOff||!BGM.cur||A.state!=='running'&&!(window.OfflineAudioContext&&A instanceof OfflineAudioContext)){return;}
  const T=TRACK[BGM.cur], spb=60/T.bpm/4, o=BUS.bgm;
  if(BGM.next<A.currentTime-.05){ const lag=Math.ceil((A.currentTime-BGM.next)/spb); BGM.step+=lag; BGM.next+=lag*spb; }   // 밀렸으면 건너뛰기 (한꺼번에 몰아 치지 않음)
  while(BGM.next<A.currentTime+horizon){ const st=BGM.step%16, bar=Math.floor(BGM.step/16), root=T.roots[bar%T.roots.length]+(BGM.mapShift||0), t=BGM.next;
    if(T.drum[st]==='x') INS.taiko(t,st===0?.42:.3,o,T.low||1);
    if(T.perc[st]==='r') INS.rim(t,.07,o);
    if(st%2===0) INS.koto(hz(deg(root+12,T.arp[(st/2)%8])),t,.07,o);
    if(st%4===0){ const m=T.mel[(st/4+(bar%2)*4)%8]; if(m&&bar%4!==3) INS.shaku(hz(deg(root+12,m[0])),t,m[1]*spb*1.05,.06,o); }
    if(st===0&&T.pad) INS.drone(hz(root-12),t,16*spb,.035,o);
    if(st===0&&bar%4===0) INS.bell(hz(root+36),t,.03,o);
    BGM.step++; BGM.next+=spb; }
}
function bgmPlay(name){ if(BGM.cur===name) return; const first=!BGM.cur; BGM.cur=name; if(!AC) return;
  if(first||BGM.next<AC.currentTime){ BGM.step=0; BGM.next=AC.currentTime+.1; }
  else { const st=BGM.step%16; if(st){ BGM.next+=(16-st)*60/TRACK[name].bpm/4; BGM.step+=16-st; } }   // 다음 마디부터 새 곡으로 자연스럽게
  if(BUS&&first){ const g=BUS.bgm.gain; g.cancelScheduledValues(AC.currentTime); g.setValueAtTime(0,AC.currentTime); g.linearRampToValueAtTime(BGM_V(),AC.currentTime+1.2); } }
function bgmUpdate(){ if(!AC||save.mute) return; if(!BGM.timer) BGM.timer=setInterval(()=>bgmTick(),120);
  const want=typeof G!=='undefined'&&G?(G.dun?'dun':(G.boss?'boss':(panel==='lobby'?'lobby':'field'))):'lobby';
  BGM.mapShift=[0,2,-2,-4][mapIdx(save.stage)]||0;
  // 보스 도전·실패가 반복될 때 곡이 계속 바뀌지 않게, 2초 넘게 유지될 때만 바꾼다
  if(want!==BGM.cur){ if(BGM.want!==want){BGM.want=want; BGM.since=performance.now();} if(!BGM.cur||performance.now()-BGM.since>2000) bgmPlay(want); } else BGM.want=null;
  bgmTick(); }

let floorTile=null;
function buildFloor(){
  const T=Math.max(1,Math.round(H)), c=mkCanvas(Math.max(1,Math.round(W*DPR)),Math.max(1,Math.round(T*DPR))), x=c.getContext('2d'); x.scale(DPR,DPR);
  const gr=x.createLinearGradient(0,0,W,0); gr.addColorStop(0,'#2a1d19'); gr.addColorStop(.5,'#4a3328'); gr.addColorStop(1,'#2a1d19');
  x.fillStyle=gr; x.fillRect(0,0,W,T);
  const edge=Math.min(26,W*.05), pw=Math.max(44,(W-edge*2)/7);
  let seed=7; const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let px=edge;px<W-edge;px+=pw){
    x.fillStyle=`rgba(${r()<.5?'0,0,0':'255,220,180'},${.03+r()*.05})`; x.fillRect(px,0,pw,T);
    x.fillStyle='rgba(0,0,0,.35)'; x.fillRect(px,0,1.5,T);
    for(let k=0;k<2;k++){const y=r()*T; x.fillRect(px,y,pw,1.5);}
  }
  x.fillStyle='#1b1520'; x.fillRect(0,0,edge,T); x.fillRect(W-edge,0,edge,T);
  const lampGap=T/3;
  for(let i=0;i<3;i++){for(const lx of [edge*.5,W-edge*.5]){const ly=lampGap*(i+.5);
    const g=x.createRadialGradient(lx,ly,2,lx,ly,edge*3.2); g.addColorStop(0,'rgba(255,180,90,.35)'); g.addColorStop(1,'rgba(255,180,90,0)');
    x.fillStyle=g; x.fillRect(lx-edge*3.2,ly-edge*3.2,edge*6.4,edge*6.4);
    x.fillStyle='#2a2330'; x.fillRect(lx-edge*.42,ly-edge*.42,edge*.84,edge*.84);
    x.fillStyle='#ffc46e'; x.fillRect(lx-edge*.22,ly-edge*.22,edge*.44,edge*.44);}}
  floorTile=c;
}

function drawFloor(scroll){

  const mi=(dk&&mapImg(dk))||mapImg(mapIdx(save.stage)); mapImg((mapIdx(save.stage)+1)%MAPS.length);
  if(mi){ // 전투 화면(위~하단 메뉴)을 꽉 채우게, 위쪽(성문·하늘)이 보이도록
    const vh=L.view||H, sc=Math.max(W/mi.width,vh/mi.height), w=mi.width*sc, h=mi.height*sc;
    ctx.fillStyle='#14111b'; ctx.fillRect(0,0,W,H); ctx.drawImage(mi,(W-w)/2,Math.min(0,vh-h)*.35,w,h); return; }
  ctx.drawImage(floorTile,0,0,W,H);   // 고정 배경
  const g=ctx.createRadialGradient(W/2,L.view*.8,10,W/2,L.view*.8,Math.max(W,H)*.7); g.addColorStop(0,'rgba(239,230,210,.07)'); g.addColorStop(1,'rgba(14,11,20,.35)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function drawPetals(dt,t){
  ctx.fillStyle='rgba(244,170,190,.7)';
  for(const p of petals){
    p.y+=p.v*dt; p.x+=Math.sin(t*1.3+p.w)*.02*dt+.01*dt; if(p.y>1.02){p.y=-.02;p.x=Math.random();} if(p.x>1.02)p.x=-.02;
    ctx.save(); ctx.translate(p.x*W,p.y*L.view); ctx.rotate(t*2+p.w); ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*.55,0,0,7); ctx.fill(); ctx.restore();
  }
}

  c.restore();
}

  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle='#c9ced8'; ctx.strokeStyle='#1a1620'; ctx.lineWidth=Math.max(1,r*.12);
  ctx.beginPath(); for(let i=0;i<8;i++){const a=i*Math.PI/4, rr=i%2?r*.38:r; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1a1620'; ctx.beginPath(); ctx.arc(0,0,r*.16,0,7); ctx.fill(); ctx.restore();
}

const sScale=s=>s<=100?Math.pow(1.11,s-1):Math.pow(1.11,99)*Math.pow(1.085,s-100), dScale=s=>Math.pow(1.07,s-1), gScale=s=>Math.pow(1.1,s-1), xScale=s=>Math.pow(1.08,s-1);   // 적 체력 증가 1.12→1.10, 공격 1.085→1.08
function spawnEnemy(type){

  let set,hp,travel;

  else if(type==='mboss'){set=4+Math.floor(Math.random()*3); hp=400*hs; travel=4;}
  else if(type==='elite'){set=Math.min(9,2+Math.floor(s/15)+Math.floor(Math.random()*3)); hp=45*hs; travel=Math.max(5,10-s*.05);}
  else {set=Math.min(9,Math.floor(s/12)+Math.floor(Math.random()*3)); hp=14*hs; travel=Math.max(4,8.5-s*.05);}
  const bossy=type==='boss'||type==='mboss', pool=monPool(s);
  const mb=monBase(s), eqd=G.dun&&G.dun.k==='equip', kind=eqd?(bossy?EQ_KIND.boss:(Math.random()<.4?EQ_KIND.ranged:EQ_KIND.melee)):type==='boss'?mb+5:type==='mboss'?mb+4:type==='elite'?pool[Math.floor(Math.random()*pool.length)]:pool[Math.floor(Math.random()*pool.length)];
  const ranged=bossy||isRangedKind(kind);
  G.enemies.push({g,eq:Array(8).fill(set),type,kind,ranged,atk:-1,fired:false,rest:0,meleeT:0,hitFx:0,hp:Math.round(hp),maxHp:Math.round(hp),u:bossy?.5:rnd(.05,.95),p:0,speed:1/travel,

// 🧪 테스트용: 던전 입장권 99장 유지. 정식 배포 때 0 으로

const TEST_OPEN=false;

const rushPieces=(L,kills)=>kills*(1+Math.floor(L/3)), rushGems=(L,kills)=>kills*(10+5*L);
function rushReward(L,kills){const got={}; for(let i=0;i<rushPieces(L,kills);i++){const r=RELICS[Math.floor(Math.random()*RELICS.length)]; rel(r.k).n++; got[r.n]=(got[r.n]||0)+1;}

const DUN_CATS=[{k:'wep',n:'쿠나이',slots:[7]},{k:'arm',n:'방어구',slots:[0,1,2,4]},{k:'acc',n:'장신구',slots:[3,5,6]}];

// (11단계: 강화 1 + 입문자 9 … 20단계: 강화 10, 21단계: 가죽 1 + 강화 9 …)
function eqMix(L){ if(L<=10) return [[0,L]];
  const j=L-10, up=Math.floor((j-1)/10)+1, nu=((j-1)%10)+1;
  if(up>9) return [[9,10]];
  return nu>=10?[[up,10]]:[[up,nu],[up-1,10-nu]]; }
const eqPer=L=>eqMix(L).reduce((a,[,n])=>a+n,0);
const eqDrops=L=>eqPer(L)*3;

const eqGrRate=L=>{const b=Math.max(0,L-10)*.02; const a=[.55-b,.83-b/2,.96-b/4,1]; return a.map((v,i)=>Math.round((v-(i?a[i-1]:0))*100));};
function eqReward(L){
  const res=[], picks=[]; for(const C of DUN_CATS) for(const [set,n] of eqMix(L)) for(let i=0;i<n;i++) picks.push([C.slots[Math.floor(Math.random()*C.slots.length)],set]);
  for(const [sl,set] of picks){const t=set*4+eqRollGr(L), key=sl+'-'+t, it=save.inv[key]||(save.inv[key]={n:0,lv:0});
    const isNew=it.lv===0; if(isNew) it.lv=1; else it.n++; res.push({s:sl,t,isNew});}

function combine(s,t){
  const it=inv(s,t); if(!it||it.n<MERGE||t>=TIERS-1) return false;
  it.n-=MERGE; const key=s+'-'+(t+1), nx=save.inv[key]||(save.inv[key]={n:0,lv:0});

}

function gradeRange(lv){return [Math.max(0,Math.floor((lv-1)/3)),Math.min(9,lv+1)];}
function rollGrade(lv){const [lo,hi]=gradeRange(lv); let tot=0; const w=[]; for(let t=lo;t<=hi;t++){const v=Math.pow(.45,t-lo);w.push([t,v]);tot+=v;}
  let r=Math.random()*tot, set=lo; for(const [t,v] of w){if((r-=v)<=0){set=t;break;}}
  const x=Math.random(), g=x<.62?0:x<.87?1:x<.97?2:3; // 등급: F 62% · D 25% · A 10% · S 3%

function summon(b,count,free){

    else{const s=b.slots[Math.floor(Math.random()*b.slots.length)], t=rollGrade(S.lv), key=s+'-'+t, it=save.inv[key]||(save.inv[key]={n:0,lv:0});

function misState(){const m=save.daily||(save.daily={day:'',c:{},got:{}}); if(m.day!==today()){m.day=today(); m.c={}; m.got={};} return m;}

/* ---- 오프라인 보상: 꺼져 있던 시간만큼, 지금 스테이지 기준으로 엽전·경험치 ---- */
const OFF_MIN=60, OFF_MAX=12*3600, OFF_RATE=.75, OFF_KPM_MIN=3, OFF_KPM_MAX=25; // 1분 이상부터, 최대 12시간
// 오프라인 1분 처치 수: 실제 전투력(초당 피해 ÷ 지금 스테이지 졸개 체력)의 75%, 3~60마리
function offlineKpm(st,s){
  const dps=st.atk*st.aps*(1+Math.min(1,st.crit)*(st.cdmg-1))*st.shots, hp=14*sScale(s);
  return Math.max(OFF_KPM_MIN,Math.min(OFF_KPM_MAX,dps/hp*60*OFF_RATE));
}
function offlineCalc(sec){
  const st=calc(), s=save.stage, m=Math.min(OFF_MAX,sec)/60;
  const kpm=offlineKpm(st,s);
  return {kpm, gold:Math.round(6*gScale(s)*(1+st.gold)*kpm*m), xp:Math.round(2*xScale(s)*(1+st.xp)*kpm*m)};
}
function offlineCheck(){
  const now=Date.now(), last=save.seen||0; save.seen=now; persist();
  if(!last||!save.picked||!$('offM').hidden) return;
  const sec=Math.floor((now-last)/1000); if(sec<OFF_MIN) return;
  const t=Math.min(OFF_MAX,sec), h=Math.floor(t/3600), mi=Math.floor(t%3600/60), r=offlineCalc(t);
  $('offBody').innerHTML=`<h2>오프라인 보상</h2>
    <p class="sub">스테이지 ${save.stage}에서 <b>${h?h+'시간 ':''}${mi}분</b> 동안 모은 보상이에요<br><small>전투력 기준 1분에 약 ${Math.round(r.kpm)}마리 처치</small>${sec>OFF_MAX?'<br>(최대 12시간까지 쌓여요)':''}</p>
    <div class="rw"><span><i class="coin"></i>엽전</span><b class="num">+${fmtKo(r.gold)}</b></div>

  $('offM').hidden=false;

// 닌자 이름: 2~8자, 앞뒤 공백·꺾쇠 제거
function cleanName(v){return (v||'').replace(/[<>&"'`\\]/g,'').replace(/\s+/g,' ').trim();}
function nameErr(v){const n=cleanName(v); return n.length<2?'이름은 2글자 이상이에요':n.length>6?'이름은 6글자까지예요':'';}

    $('pickM').hidden=true; startGame();};

// 이름 짓기 · 바꾸기 창 (기존 닌자는 처음 한 번, 로비에서 언제든)
function askName(first){
  $('infoBody').innerHTML=`<h2>${first?'닌자 이름 짓기':'이름 바꾸기'}</h2>
    <p class="note" style="text-align:center">${first?'함께할 닌자의 이름을 지어 주세요.':'새 이름을 적어 주세요.'} (2~6자)</p>
    <input class="nm" id="nmIn" maxlength="6" placeholder="닌자 이름" autocomplete="off">
    <div class="nmerr" id="nmErr"></div>
    ${first?'':'<div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="obtn brown" id="nmNo">취소</button>'}
    <button class="obtn big" id="nmOk">정했어요</button>${first?'':'</div>'}`;
  $('infoM').hidden=false; const inp=$('nmIn'); inp.value=save.name||'';

}
if(AUTO) window.__bgm=()=>({step:BGM.step,next:BGM.next,now:AC?AC.currentTime:-1,cur:BGM.cur,state:AC&&AC.state});
if(AUTO) window.__snd={ async render(name,sec){ const off=new OfflineAudioContext(2,44100*sec,44100), keep=AC; AC=off; makeBus(); BUS.bgm.gain.value=.42; BGM.cur=name; BGM.step=0; BGM.next=.05; bgmTick(sec-.5);
    const buf=await off.startRendering(); AC=keep; if(keep) makeBus(); BGM.cur=null; const L=buf.getChannelData(0), R=buf.getChannelData(1); let pk=0,ss=0; for(let i=0;i<L.length;i++){const v=Math.abs(L[i]); if(v>pk) pk=v; ss+=L[i]*L[i];}
    const n=L.length, out=new Int16Array(n*2); for(let i=0;i<n;i++){out[2*i]=Math.max(-1,Math.min(1,L[i]))*32767; out[2*i+1]=Math.max(-1,Math.min(1,R[i]))*32767;}
    let b='', u=new Uint8Array(out.buffer); for(let i=0;i<u.length;i+=32768) b+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return {peak:pk,rms:Math.sqrt(ss/n),pcm:btoa(b)}; } };
if(AUTO) window.__t={spawn:t=>spawnEnemy(t),g:()=>G};   // 자동 테스트 전용
// 자동 밸런스 점검(백테스트) 전용: 사람처럼 강화·소환·합성·장착·승급을 하며 시간을 빠르게 돌린다
if(AUTO) window.__sim={
  play(sec,dt=1/15){ const n=Math.round(sec/dt); for(let i=0;i<n;i++){ update(dt); if(G.dead){G.deathT=(G.deathT||0)+dt; if(G.deathT>1.2){G.deathT=0; revive();}} if(i%Math.round(10/dt)===0) this.act(); } },
  act(){
    // 엽전: 가장 싼 골드 강화부터
    let guard=0; while(guard++<4000){ let best=null,bc=1e300; for(const u of UPG){ if(upLv(u.k)>=u.max) continue; const c=upCost(u,upLv(u.k)); if(c<bc){bc=c;best=u;} } if(!best||bc>save.gold) break; save.gold-=bc; save.up[best.k]=upLv(best.k)+1; mis('up'); }
    // 스텟 포인트: 공격력·HP·공속 번갈아
    const ord=SP.map(x=>x.k); let i=0; while(spLeft()>0&&i<5000){const k=ord[i%ord.length]; const p=SP.find(x=>x.k===k); if((save.sp[k]||0)<p.max) save.sp[k]=(save.sp[k]||0)+1; i++;}
    // 승급
    while(save.rank<RANKS.length-1&&rankReady()){save.rank++; save.gems+=1000;}
    // 보석: 10회 소환 (장비 3종 + 유물 돌아가며)
    this.bi=this.bi||0; while(save.gems>=COST10+500){ const b=BANNERS[this.bi++%BANNERS.length]; summon(b,10,false); }
    // 합성 · 자동 장착 · 유물 제작
    for(let sl=0;sl<8;sl++) for(let k=0;k<TIERS-1;k++) while(combine(sl,k));
    for(let sl=0;sl<8;sl++){let best=0; for(let k=0;k<TIERS;k++) if(owned(sl,k)) best=k; save.eq[sl]=best;}
    for(const r of RELICS){const R=rel(r.k); while(R.n>0&&R.lv<RELIC_MAX){R.n--; if(Math.random()<RELIC_RATE) R.lv++;}}
    // 장비 강화: 입은 장비를 엽전 남는 만큼
    for(let sl=0;sl<8;sl++){const t=save.eq[sl], it=inv(sl,t); let g=0; while(it&&it.lv<itemMax(it)&&g++<50){const c=enhCost(t,it.lv); if(c>save.gold*.3) break; save.gold-=c; it.lv++;}}
    // 환생: 20분(게임 시간) 동안 최고 기록이 안 오르면 환생 → 환생석은 가장 싼 능력치부터
    this.tt=(this.tt||0)+10; if((save.runBest||0)>(this.lb||0)){this.lb=save.runBest; this.lt=this.tt;}
    if(this.autoReb&&rebReady()&&this.tt-(this.lt||0)>=900){ doRebirth(true); this.rebs=(this.rebs||0)+1; this.lt=this.tt; this.lb=0; }
    let g2=0; while(g2++<500){ let b=null,bc=1e9; for(const R of REB){const lv=rebLv(R.k); if(lv<REB_MAX&&rebCost(lv)<bc){bc=rebCost(lv);b=R;}} if(!b||rebStone()<bc) break; const RR=save.reb||(save.reb={}); RR.st-=bc; (RR.lv||(RR.lv={}))[b.k]=rebLv(b.k)+1; }
    refreshStats();
  },
  info(){ const st=calc(); return {stage:save.stage,best:save.bestStage,lv:save.lv,rank:save.rank,gold:Math.round(save.gold),gems:save.gems,cp:st.cp,atk:st.atk,hp:st.hp,aps:+st.aps.toFixed(2),crit:+st.crit.toFixed(2),pulls:save.pulls,eqSet:save.eq.map(setOf).join(''),relic:relicSum(),rebs:this.rebs||0,run:save.runBest||0,stone:rebStone(),rebLv:rebLv('atk'),atkMul:+st.atkMul.toFixed(1)}; },
  offline(sec){ return offlineCalc(sec); },
  reb(){ return {ready:rebReady(),stones:rebStones(rebRun())}; }
};
function startGame(){ setTimeout(()=>{const b=monBase(save.stage); for(let k=b;k<b+6;k++) for(const c of 'waqhd') monImg(k,c);},1500);   // 던전에서 나오는 몬스터까지 미리 받아 둔다
  $('ui').hidden=false; initBattle(); layout(); drawAvatar(); updateTop(); updateDots(); openPanel('lobby'); offlineCheck(); if(AUTO&&!save.name) save.name='테스트'; if(!save.name) askName(true); tutInit(); attPopup(); } // 시작은 로비부터

/* ---- 튜토리얼: 처음 시작한 닌자에게 한 단계씩 손가락 안내 ---- */
const navB=p=>document.querySelector(`#nav [data-p="${p}"]`);
const TUT=[
  {txt:'어서 와요, 닌자! 🥷<br>닌자는 <b>자동으로 쿠나이를 던져요.</b><br>적을 쓰러뜨리면 <b>엽전(골드)</b>과 <b>경험치</b>를 얻어요.'},
  {txt:'엽전으로 닌자를 강하게 만들어 봐요.<br>아래 <b>[성장]</b> 탭을 눌러 주세요.', el:()=>navB('grow'), done:()=>panel==='grow'},
  {txt:()=>'<b>공격력</b>의 강화 버튼을 눌러 보세요!'+(tut.gift?'<br>(선물로 <b>엽전 300</b>을 드렸어요)':''), enter:()=>{tut.gift=!save.tutG; if(tut.gift){save.tutG=1; save.gold+=300; persist(); updateTop();}},
    el:()=>panel!=='grow'?navB('grow'):view.grow!=='gold'?document.querySelector('#ptabs [data-k="gold"]'):document.querySelector('#pbody [data-u="atk"] .obtn'),
    done:t=>upLv('atk')>t.a0, init:t=>{t.a0=upLv('atk');}},
  {txt:'잘했어요! 이번엔 <b>[장비]</b> 탭을 눌러 보세요.', el:()=>navB('gear'), done:()=>panel==='gear'},
  {txt:'장비는 <b>같은 것을 모아 합성</b>하고, <b>엽전으로 강화</b>해요.<br>닌자 모습은 <b>[스킨]</b> 탭에서 세트별로 갈아입어요!', el:()=>$('pbody')},
  {txt:'<b>[컨텐츠]</b> 탭도 눌러 볼까요?', el:()=>navB('content'), done:()=>panel==='content'},
  {txt:'여기엔 <b>던전</b>이 있어요. 스테이지를 넘을수록 하나씩 열리고,<br>입장권은 <b>매일 다시 채워져요.</b>', el:()=>$('pbody')},
  {txt:'적을 쓰러뜨리다 보면 <b>보스</b>가 나타나요.<br>보스를 잡으면 <b>다음 스테이지</b>로 넘어가요!', el:()=>$('stagebox'), enter:()=>{if(panel) openPanel(panel);}},
  {txt:'가운데 <b>로비</b> 버튼의 <b>⚙ 설정</b>에서 소리 조절과 <b>기록 백업</b>을 할 수 있어요.<br>기록 백업은 꼭 한 번 해 두세요!', el:()=>$('navMid')},
];
const tut={i:-1};
function tutInit(){
  if(save.tut===undefined){ save.tut=(save.lv<=3&&(save.bestStage||0)<3)?0:'done'; persist(); }
  if(save.tut!=='done') tutGo(save.tut|0);
}
function tutStart(){ save.tut=0; persist(); tutGo(0); }
function tutGo(i){
  if(i>=TUT.length){ tut.i=-1; $('tut').hidden=true; save.tut='done'; if(!save.tutRw){save.tutRw=1; save.gems+=300; toast('튜토리얼 완료! 보석 +300');} else toast('튜토리얼 완료!'); persist(); updateTop(); SFX.buy(); updateDots(); setTimeout(attPopup,1500); return; }
  tut.i=i; save.tut=i; persist(); const S=TUT[i]; if(S.enter) S.enter(); if(S.init) S.init(tut);
  $('tBub').innerHTML=`<div>${typeof S.txt==='function'?S.txt():S.txt}</div><div class="tfoot"><button class="tskip" id="tSkip">건너뛰기</button><span class="tstep">${i+1} / ${TUT.length}</span>${S.done?'':'<button class="obtn" id="tNext">다음</button>'}</div>`;
  $('tSkip').onclick=()=>{SFX.tap(); tut.i=-1; $('tut').hidden=true; save.tut='done'; persist(); setTimeout(attPopup,400);};
  if($('tNext')) $('tNext').onclick=()=>{SFX.tap(); tutGo(i+1);};
  $('tut').hidden=true; tutTick();
}
function tutTick(){
  if(tut.i<0) return;
  const S=TUT[tut.i], busy=!$('offM').hidden||!$('attM').hidden||!$('infoM').hidden||!$('pickM').hidden||!$('sumM').hidden;
  if(busy){$('tut').hidden=true; return;}
  if(S.done&&S.done(tut)){ SFX.up(); tutGo(tut.i+1); return; }
  $('tut').hidden=false;
  const app=$('app').getBoundingClientRect(), e=S.el&&S.el(), r=e&&e.getBoundingClientRect(), ring=$('tRing'), bub=$('tBub'), dim=$('tDim');
  if(r&&r.width>0){
    const pad=4; ring.hidden=false; dim.hidden=true;
    Object.assign(ring.style,{left:(r.left-app.left-pad)+'px',top:(r.top-app.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    const mid=r.top-app.top+r.height/2, bh=bub.offsetHeight;
    if(mid>app.height*.5) bub.style.top=Math.max(8,r.top-app.top-pad-bh-12)+'px';
    else bub.style.top=Math.min(app.height-bh-8,r.bottom-app.top+pad+12)+'px';
  }else{ ring.hidden=true; dim.hidden=false; bub.style.top=Math.max(8,(app.height-bub.offsetHeight)/2)+'px'; }
}

/* ================= 루프 ================= */
let last=performance.now(), bgmT=0;
function frame(now){
  requestAnimationFrame(frame);

}

setMid(); resize(); requestAnimationFrame(frame);
(async()=>{
  try{
    const jobs=[];
    for(const g of ['f','m']){
      for(const a of ANIMS) jobs.push(loadImg(aurl(`${g}_${a}.webp`)).then(img=>{base[g][a]=analyze(g,a,img);}));
      jobs.push(loadImg(aurl(`${g}_items.webp`)).then(img=>{atlas[g]=img;}));
    }
    // 무거운 세트 그림은 지금 입은 것만 먼저 받고, 나머지는 필요할 때 받는다
    for(const k of monPool(save.stage).slice(0,2)) jobs.push(preloadMon(k));
    if(save.picked){const st=skinSet(); for(const c of ['I','r','p']) jobs.push(preloadReal(c,save.g,st)); jobs.push(preloadReal('k','',skinSet()));}
    else for(const g of ['f','m']) jobs.push(preloadReal('i',g,0));
    const TIPS=['팁: 컨텐츠 탭의 던전에서 골드와 장비를 모을 수 있어요','팁: 수련의 탑 10층마다 영구 능력치가 올라가요','팁: 게임을 꺼 두어도 오프라인 보상이 쌓여요','팁: 보스 러시에서 유물 조각을 모아 유물을 키워요'];
    $('ltip').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];
    let done=0; const tot=jobs.length, t0=performance.now();
    const prog=()=>{const pc=Math.round(done/tot*100); $('lmsg').textContent=`닌자 불러오는 중… ${pc}%`; $('lbar').style.width=pc+'%';};
    jobs.forEach(j=>j.then(()=>{done++; prog();}));
    await Promise.all(jobs);
    if(!AUTO){ // 다 불러오면 "터치하여 게임 시작" — 터치 한 번에 소리도 함께 켜진다
      $('lmsg').textContent='화면을 터치하여 게임 시작'; $('lmsg').classList.add('ltap'); $('loading').classList.add('ready');
      await new Promise(r=>{const go=()=>{$('loading').removeEventListener('pointerdown',go); window.removeEventListener('keydown',go); r();};
        $('loading').addEventListener('pointerdown',go); window.addEventListener('keydown',go);});
      ac(); SFX.tap();
    }
    $('loading').classList.add('out'); setTimeout(()=>{$('loading').hidden=true;},460);
    if(save.picked) startGame(); else showPick();
  }catch(err){$('lmsg').textContent='그림을 불러오지 못했어요. 새로고침해 주세요.';console.error(err);}
})();
})();
